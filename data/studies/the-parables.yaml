# The parables of Jesus. Each parable links to the Scripture it draws on and the
# passages that carry its themes further; every link names its theme (`topic`),
# which becomes a branch on the connection map. Links are typed by `category`.
id: the-parables
title: The Parables of Jesus
subtitle: Every parable in the Gospels, with the Scriptures each one draws on and the themes it opens
kind: connections
chart: map
summary: >-
  Jesus taught in parables: stories and pictures that reveal the kingdom to those who
  listen and hide it from those who will not. This study gathers the parables of the
  Synoptic Gospels and the great figures of John, grouped by their subject. Zoom into a
  parable to see the Old Testament images it builds on, where the same theme surfaces
  elsewhere in the New Testament, and the passages where Jesus explains Himself.
tags: [parables, jesus, gospels, kingdom]
categories:
  parallel:
    title: Parallel account
    note: The same parable told in another Gospel.
  background:
    title: Old Testament background
    note: The image, law or promise the parable builds on.
  theme:
    title: Theme elsewhere
    note: Where the rest of the New Testament takes the parable's theme further.
  explained:
    title: Jesus explains
    note: Where Jesus Himself interprets the parable or states its point.
views:
  - title: By subject
    note: Seven subjects the parables keep returning to.

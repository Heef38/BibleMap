# The book of Isaiah: how it is built, who each prophecy was spoken to, and where its promises lead.
# Every passage carries three tags (who it was spoken to, when it comes true, what kind of word it is)
# so the Patterns chart can count them, and links to where the rest of the Bible picks it up.
# Quotations follow the Berean Standard Bible.
id: isaiah
title: "The Book of Isaiah"
subtitle: "Who each prophecy was spoken to, the great themes, and where its promises lead: to the return from Babylon, to Christ, and to the new creation"
kind: connections
chart: map
added: "2026-09-21"
summary: >-
  Isaiah son of Amoz preached in Jerusalem for about forty years, from the year King Uzziah died
  (about 740 BC) into the reign of Hezekiah. His world was ruled by Assyria, which swallowed the
  northern kingdom of Israel in 722 BC and nearly took Jerusalem in 701. The book moves in three
  parts. Chapters 1–39 speak to Judah in Isaiah's own day: judgment on a proud and unjust people,
  and hope in a coming King. Chapters 40–55 speak comfort to the exiles in Babylon more than a
  century later: their God is the only God, he will send Cyrus to set them free, and his Servant
  will carry their sin. Chapters 56–66 speak to the people back home, still waiting, and end with
  new heavens and a new earth. Many scholars think later prophets in Isaiah's line wrote the second
  and third parts; Jewish and Christian tradition, and the New Testament, which quotes both halves
  under Isaiah's name (John 12:38–41), receive the book as his. Either way it asks to be read as
  one: "the Holy One of Israel," Isaiah's own name for God, appears 12 times in chapters 1–39 and
  14 times in chapters 40–66. Isaiah is the prophet the New Testament quotes most. Every passage
  here is tagged with who it was spoken to, when it comes true, and what kind of word it is, and
  linked to where the rest of the Bible picks it up.
tags: [isaiah, prophecy, messiah, servant, exile, new creation]
categories:

            label: "Fire"
            note: "He will baptize you with the Holy Spirit and with fire"
            links:
              - { to: "Acts 2:3", topic: "Tongues like flames of fire", category: church }
              - { to: "1 Thess 5:19", topic: "Do not extinguish the Spirit", category: us }
          - ref: "John 7:37-39"
            label: "Living water"
            links:
              - { to: "Isa 44:3", topic: "I will pour out My Spirit on your descendants", category: ot }
              - { to: "Ezek 47:1-9", topic: "The river from the temple", category: ot }
              - { to: "1 Cor 12:13", topic: "All given one Spirit to drink", category: us }
          - ref: "Matt 3:16-17"
            label: "A dove"
            links:
              - { to: "Gen 1:1-2", topic: "Hovering over the waters", category: ot }
          - ref: "1 John 2:20-27"
            label: "Anointing oil"
            note: "You have an anointing from the Holy One"
            links:
              - { to: "1 Sam 16:13", topic: "Oil, and the Spirit rushed upon David", category: ot }

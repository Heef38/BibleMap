            label: "The Spirit of God lives in you"
          - ref: "1 Cor 6:19-20"
            label: "Your body is a temple of the Holy Spirit"
          - ref: "Gal 4:6-7"
            label: "The Spirit of His Son in our hearts"
          - ref: "1 John 4:13"

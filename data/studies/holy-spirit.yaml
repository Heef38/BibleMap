# The Holy Spirit: who he is, how he moves, what he does in believers, and the fruit he grows.
# "How the Spirit moves" gathers the accounts where the Spirit comes on people, from creation to
# Revelation, and tags each on three facets (how he came, what followed, what was happening) so
# the Patterns chart can count them. Tags follow the words of the text; notes flag judgment calls.
id: holy-spirit
title: "The Holy Spirit"
subtitle: "Who he is, how he moves, what he does in us, and the fruit he grows"
kind: connections
chart: map
summary: >-
  "When the Spirit of truth comes, He will guide you into all truth" (John 16:13). The Spirit
  hovers over the waters at creation, rushes on judges and kings, fills craftsmen and prophets,
  rests on Jesus, and is poured out at Pentecost on sons and daughters alike. He is not a force
  but a person who speaks, teaches, grieves and prays, and he is God himself. This study follows
  who he is, the many ways he moves (the Patterns chart counts how he came and what followed),
  what he does in those he lives in, and the fruit he grows in them.
tags: [holy spirit, fruit of the spirit, gifts, pentecost, prayer, discipleship]
added: "2026-09-19"
categories:
  jesus:
    title: "In Jesus"
    note: "Where the Spirit is on Jesus, or Jesus shows the same thing."
  ot:
    title: "In the Old Testament"
    note: "Promises, pictures and earlier moments of the same work."
  church:
    title: "In the early church"
    note: "Where the book of Acts shows it happening."
  us:
    title: "Taught to us"
    note: "Where the letters teach it to believers."
facets:
  came:
    title: "How he came"
    note: "The words the text uses for the Spirit's coming. One account can use more than one."
    values:
      upon: { title: "Came on them or into them", note: "Came upon, rushed upon, rested on, descended on, entered." }
      filled: { title: "Filled them", note: "Filled with the Spirit, or full of the Spirit." }
      poured: { title: "Poured out or fell on them" }
      hands: { title: "Through hands laid on them" }
      breath: { title: "As breath or wind" }
      overshadow: { title: "Hovered or overshadowed" }
      spoke: { title: "Spoke, led or carried them", note: "The Spirit said, led, sent, prevented, compelled, carried away." }
  followed:
    title: "What followed"
    note: "What the text says happened next. One account can have more than one."
    values:
      speech: { title: "Prophecy, praise or tongues", note: "They prophesied, praised God, or spoke in other tongues." }
      bold: { title: "Bold witness or rebuke", note: "Preaching, testimony before rulers, or a word of rebuke." }
      strength: { title: "Strength and leadership", note: "Judges, kings and prophets empowered to lead and deliver." }
      skill: { title: "Wisdom and skill" }
      life: { title: "Life and new creation", note: "Creation, conception, dry bones living again." }
      guidance: { title: "Guidance and sending" }
      sight: { title: "Visions and revelation", note: "Something seen or revealed: heaven opened, the glory of God." }
      joy: { title: "Joy" }
      unrecorded: { title: "Not described", note: "The text says they received the Spirit, but not what followed." }
  setting:
    title: "What was happening"
    note: "The situation the Spirit came into, where the text makes it plain."
    values:
      prayer: { title: "Prayer, fasting or worship" }
      danger: { title: "Danger or opposition", note: "Enemies, threats, trials, persecution, exile." }
      calling: { title: "A calling or commissioning", note: "Someone being set apart, anointed or sent." }
      word: { title: "The word read, preached or spoken" }
      everyday: { title: "Everyday life", note: "A greeting, a family day, a walk, a road." }
views:
  - title: "Who he is"
    note: "A person, not a force; God himself; the names Scripture gives him; and the pictures it uses."
    groups:
      - title: "A person, not a force"
        note: "He speaks, teaches, decides, loves, prays and can be grieved."
        refs:
          - ref: "Acts 13:2"
            label: "He speaks"
            note: "\"Set apart for Me Barnabas and Saul\""
            links:
              - { to: "Rev 2:7", topic: "Hear what the Spirit says to the churches", category: us }
              - { to: "Heb 3:7-8", topic: "As the Holy Spirit says", category: us }
          - ref: "John 14:26"
            label: "He teaches and reminds"
            links:
              - { to: "1 Cor 2:13", topic: "Words taught by the Spirit", category: us }
          - ref: "Rom 8:26-27"
            label: "He prays for us, and has a mind"
            note: "The Spirit intercedes for us with groans too deep for words"
            links:
              - { to: "Heb 7:25", topic: "He always lives to intercede", category: jesus }
          - ref: "1 Cor 12:11"
            label: "He decides"
            note: "He apportions gifts to each one as He determines"
          - ref: "Acts 15:28"
            label: "It seemed good to the Holy Spirit and to us"
          - ref: "Rom 15:30"
            label: "The love of the Spirit"
          - ref: "Eph 4:30"
            label: "He can be grieved"
            links:
              - { to: "Isa 63:10", topic: "They rebelled and grieved His Holy Spirit", category: ot }
      - title: "God himself"
        refs:
          - ref: "Acts 5:1-4"
            label: "Lying to the Spirit is lying to God"
          - ref: "1 Cor 2:10-11"
            label: "He searches the deep things of God"
          - ref: "Ps 139:7-10"
            label: "Where can I go to escape Your Spirit?"
          - ref: "Heb 9:14"
            label: "The eternal Spirit"
            links:
              - { to: "Heb 9:11-12", topic: "Christ entered the Most Holy Place once for all", category: jesus }
          - ref: "Job 33:4"
            label: "The Spirit of God has made me"
            links:
              - { to: "Gen 1:1-2", topic: "Hovering over the waters", category: ot }
              - { to: "Ps 104:29-30", topic: "When You send Your Spirit, they are created", category: ot }
          - ref: "Matt 28:19-20"
            label: "One name: Father, Son and Holy Spirit"
            links:
              - { to: "2 Cor 13:14", topic: "The grace, the love, the fellowship", category: us }
              - { to: "1 Pet 1:1-2", topic: "Father, Spirit and Jesus Christ", category: us }
          - ref: "2 Cor 3:17-18"
            label: "The Lord is the Spirit"
            note: "Where the Spirit of the Lord is, there is freedom"
      - title: "His names"
        refs:
          - ref: "John 14:16-17"
            label: "Another Advocate, the Spirit of truth"
            links:
              - { to: "John 15:26", topic: "The Advocate testifies about me", category: jesus }
              - { to: "John 16:7", topic: "It is for your benefit that I am going away", category: jesus }
          - ref: "Isa 11:1-3"
            label: "The Spirit of wisdom and understanding, counsel and strength"
            note: "And the Spirit of knowledge and fear of the LORD, resting on the coming King"
            links:
              - { to: "Luke 2:40", topic: "Filled with wisdom, the grace of God upon him", category: jesus }
          - ref: "Rom 8:14-16"
            label: "The Spirit of adoption"
            note: "By whom we cry, \"Abba! Father!\""
            links:
              - { to: "Gal 4:6-7", topic: "The Spirit of His Son in our hearts", category: us }
          - ref: "Rom 8:1-2"
            label: "The Spirit of life"
          - ref: "Heb 10:29"
            label: "The Spirit of grace"
            links:
              - { to: "Zech 12:10", topic: "A spirit of grace and prayer poured out", category: ot }
          - ref: "1 Pet 4:14"
            label: "The Spirit of glory"
          - ref: "Rom 8:9"
            label: "The Spirit of God, the Spirit of Christ"
            links:
              - { to: "Phil 1:19", topic: "The Spirit of Jesus Christ", category: us }
          - ref: "Eph 1:13-14"
            label: "The promised Holy Spirit"
            note: "A seal, and the pledge of our inheritance"
      - title: "Pictures of the Spirit"
        note: "In Hebrew and in Greek one word means spirit, wind and breath."
        refs:
          - ref: "John 3:5-8"
            label: "Wind"
            note: "The wind blows where it wishes. So it is with everyone born of the Spirit"
            links:
              - { to: "Ezek 37:9-10", topic: "Come from the four winds, O breath", category: ot }
              - { to: "Acts 2:1-2", topic: "A sound like a mighty rushing wind", category: church }

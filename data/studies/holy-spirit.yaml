  - title: "The fruit of the Spirit"
    note: "Galatians 5 lists one fruit with nine parts. The groups of three follow a common way of teaching them, not the text itself."
    groups:
      - title: "The walk that bears fruit"
        refs:
          - ref: "Gal 5:16-26"
            label: "Walk by the Spirit"
            note: "The works of the flesh, the fruit of the Spirit, and walking in step with the Spirit"
          - ref: "John 15:1-8"
            label: "Remain in me and you will bear much fruit"
          - ref: "Matt 7:16-20"
            label: "By their fruit you will recognize them"
            links:
              - { to: "Ps 1:1-3", topic: "A tree that yields its fruit in season", category: ot }
      - title: "Love, joy, peace"
        refs:
          - ref: "1 Cor 13:4-7"
            label: "Love"
            note: "Love is patient, love is kind"
            links:
              - { to: "Rom 5:5", topic: "God's love poured into our hearts through the Spirit", category: us }
              - { to: "John 13:34-35", topic: "As I have loved you", category: jesus }
              - { to: "Col 3:14", topic: "Over all these virtues put on love", category: us }
          - ref: "Rom 14:17"
            label: "Joy"
            note: "Righteousness, peace, and joy in the Holy Spirit"
            links:
              - { to: "Luke 10:21", topic: "He rejoiced in the Holy Spirit", category: jesus }
              - { to: "1 Thess 1:6", topic: "The joy of the Holy Spirit in great suffering", category: church }
              - { to: "Neh 8:10", topic: "The joy of the LORD is your strength", category: ot }
          - ref: "Rom 8:6"
            label: "Peace"
            note: "The mind of the Spirit is life and peace"
            links:
              - { to: "John 14:26-27", topic: "My peace I give to you", category: jesus }
              - { to: "Phil 4:6-7", topic: "The peace of God, which surpasses all understanding", category: us }
              - { to: "Isa 26:3", topic: "Perfect peace", category: ot }
      - title: "Patience, kindness, goodness"

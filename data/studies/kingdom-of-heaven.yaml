# A study is a plain file: groups of references, several ways to view them.
# Weights are computed at build time: any reference containing the words of Jesus
# (red-letter markup in the Berean Standard Bible) counts 3, everything else 1.
# Override with `weight:` on a reference or a group when you disagree.
id: kingdom-of-heaven
title: The Kingdom of Heaven
subtitle: Every reference to the kingdom of heaven and the kingdom of God, and the promises behind them
summary: >-
  "The kingdom of heaven" is Matthew's phrase; Mark, Luke and John say "the kingdom of God"
  for the same reality. Jesus announces it, describes it in parables, tells us who enters it,
  and reveals Himself as its King. The Old Testament prepared for it, the apostles preached it,
  and Revelation shows it fulfilled. This study gathers all of those references so the whole
  arc can be seen at once.
tags: [theme, jesus, gospels]

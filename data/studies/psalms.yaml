# The Psalms, sorted four ways. Notes are the BSB section headings; the New Testament
# quotations are attached as links so the map can branch from a psalm to where it is cited.
# Authorship follows the Hebrew superscriptions; the type of each psalm is one common
# classification and is meant as a reading aid, since many psalms mix kinds.
id: psalms
title: The Psalms
subtitle: All 150 psalms by type, author, book and collection, with the ones the New Testament quotes
kind: connections
chart: map
summary: >-
  The Psalms are Israel's prayer book and hymnal, and the book the New Testament quotes
  more than any other. This study lets you see the whole collection at once: what kind of
  song each psalm is, who wrote it, which of the five books it belongs to, and which
  psalms the apostles and Jesus Himself took up as speaking of Christ.
tags: [psalms, poetry, prayer, worship]
categories:
  quoted:
    title: Quoted in the New Testament
    note: The psalm is cited in the New Testament; the link shows where.
views:
  - title: By type
    note: Eight kinds of psalm. Many psalms mix kinds; each is placed where its main movement lies.
    groups:

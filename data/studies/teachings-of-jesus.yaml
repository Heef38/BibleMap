# What Jesus taught, gathered by subject across the four Gospels. The parables and the
# Sermon on the Mount have their own studies; this one reaches across all His sayings.
# Each saying links to its Old Testament roots, Jesus's own parallels, and the apostles' echoes.
id: teachings-of-jesus
title: "The Teachings of Jesus"
subtitle: "What Jesus taught, by subject, across the four Gospels, with the roots and the echoes of each saying"
kind: connections
chart: map
summary: >-
  "No one ever spoke like this man" (John 7:46). This study gathers what Jesus taught about
  Himself, the kingdom, discipleship, love and forgiveness, prayer and faith, money, the
  Spirit and the Word, and the end. Every saying is in His own words, so every reference
  weighs three; zoom into one to see the Scripture it grows from, where He said it again,
  and how the apostles carried it on.
tags: [jesus, teaching, gospels, discipleship]
categories:
  background:
    title: "Old Testament roots"
    note: "The promise, law, psalm or prophet the saying grows from."
  parallel:
    title: "Parallel account"
    note: "The same teaching in another Gospel."
  jesus:
    title: "Jesus elsewhere"
    note: "Where Jesus says it again, or fills it out."
  echo:
    title: "Echoed by the apostles"
    note: "Where the apostles teach the same thing."
views:
  - title: "By subject"
    note: "Eight subjects Jesus returned to again and again."

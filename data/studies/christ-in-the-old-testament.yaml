# The Old Testament witness to Jesus, as the New Testament reads it.
# Each reference is an Old Testament passage; `to` is where the New Testament takes it up.
# `category` says how: a direct reference, a type, or a shadow (see the definitions below).
# Weights follow the usual rule: when Jesus Himself makes the connection, it counts three.
id: christ-in-the-old-testament
title: Christ in the Old Testament
subtitle: How the Law, the Prophets and the Psalms speak of Jesus, sorted into direct references, types and shadows
kind: connections
summary: >-
  "Beginning with Moses and all the Prophets, He explained to them what was written in all the
  Scriptures about Himself" (Luke 24:27). This study follows that reading. A direct reference is a
  passage that speaks of the Messiah and that the New Testament cites as fulfilled in Jesus. A type
  is a person or event God shaped to prefigure Him. A shadow is an institution of the Law whose
  substance is Christ. The categories are a reading aid, not a verdict; many passages carry more
  than one.
tags: [typology, prophecy, jesus, old-testament]
categories:
  direct:
    title: Direct reference
    note: The passage speaks of the Messiah, and the New Testament cites it as fulfilled in Jesus.
  type:
    title: Type
    note: A person or event God shaped to prefigure Christ, read that way by the New Testament.
  shadow:
    title: Shadow
    note: An institution or practice of the Law whose substance is Christ (Colossians 2:17, Hebrews 10:1).
  witness:
    title: Witness
    note: Jesus and the apostles saying, in so many words, that the Scriptures are about Him.

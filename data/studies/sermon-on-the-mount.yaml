# The Sermon on the Mount, section by section. Every saying links to the Law Jesus cites
# ("You have heard that it was said"), the Old Testament behind it, Luke's parallel,
# Jesus's own words elsewhere, and where the apostles take it up (James most of all).
id: sermon-on-the-mount
title: "The Sermon on the Mount"
subtitle: "Matthew 5–7 section by section, with the Law Jesus cites, Luke's parallels, and the echoes in the apostles"
kind: connections
chart: map
summary: >-
  Jesus went up the mountain, sat down, and taught: the character of the kingdom's people,
  the true depth of the Law, the secret life of giving, prayer and fasting, and the two
  roads. This study walks through Matthew 5 to 7 in order. Zoom into a saying to see the
  text Jesus was answering, where Luke records the same teaching, and how James, Peter,
  Paul and John repeat it.
tags: [sermon on the mount, jesus, matthew, ethics]
categories:
  quoted:
    title: "The Law Jesus cites"
    note: "The Old Testament text Jesus quotes or answers."
  background:
    title: "Old Testament background"
    note: "The promise, psalm or prophet behind the saying."
  parallel:
    title: "Luke's parallel"
    note: "The Sermon on the Plain (Luke 6) and other parallels."
  jesus:
    title: "Jesus elsewhere"
    note: "Where Jesus says it again, or fills it out."
  echo:
    title: "Echoed by the apostles"
    note: "Where James, Peter, Paul and John take the saying up."
views:

# The materials of the tabernacle and the Old Testament, and what they came to mean.
# Each material is anchored to a passage; the links show where Scripture states its meaning
# outright, where a pattern of use gives it, and where it points to Christ or to His people.
# Notes mark the traditional readings so the reader can weigh them.
id: materials-and-meanings
title: "Materials and Their Meanings"
subtitle: "Gold, silver, bronze, acacia, linen and scarlet, oil and blood, fire and stone, and the numbers: what the materials of Scripture came to mean"
kind: connections
chart: map
summary: >-
  The text never pauses to explain why the altar is bronze and the ark is gold, or why the
  frames are acacia and the priests wear linen. But Scripture uses its materials with great
  consistency, sometimes says outright what one means, and the New Testament reads several of
  them as pictures of Christ and His people. Each entry here gives the anchor passage, then the
  places that show the pattern and the places that state the meaning. Where a meaning is a
  long-standing reading rather than a statement of the text, the note says so.
tags: [typology, tabernacle, symbols, materials, numbers]
categories:
  stated:
    title: "Stated in Scripture"
    note: "A passage that gives the meaning outright."
  pattern:
    title: "Pattern of use"
    note: "The material recurring in the same role, from which the meaning is drawn."
  christ:
    title: "Pointing to Christ"
    note: "Where the material becomes a picture of Jesus."
  church:
    title: "The believer and the church"
    note: "Where the material describes God's people."
views:

              - { to: "Eph 2:18", topic: "Access to the Father by one Spirit", category: church }
              - { to: "Ps 100:4", topic: "Enter His gates with thanksgiving", category: church }
              - { to: "Rev 21:12-13, 25", topic: "The gates of the city", category: heaven }

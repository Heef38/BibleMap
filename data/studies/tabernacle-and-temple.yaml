              - { to: "2 Cor 4:7", topic: "Treasure in jars of clay", category: church }
              - { to: "Gen 22:13", topic: "The ram in the thicket", category: christ }
          - ref: "Exod 26:15-30"
            label: "The frames of acacia overlaid with gold"
            note: "Upright boards, each standing in silver sockets, joined into one"
            links:
              - { to: "1 Pet 2:5", topic: "Living stones built into a house", category: church }
              - { to: "Eph 4:15-16", topic: "The whole body joined and held together", category: church }
              - { to: "Exod 38:25-28", topic: "The silver sockets from the atonement money", category: temple }
          - ref: "Exod 40:34-38"
            label: "The glory fills the tabernacle"
            note: "Moses could not enter, because the cloud had settled on it"
            links:
              - { to: "1 Kgs 8:10-11", topic: "The glory fills Solomon's temple", category: temple }
              - { to: "John 2:19-21", topic: "The temple of His body", category: christ }
              - { to: "John 1:14", topic: "We beheld His glory", category: christ }
              - { to: "Acts 2:1-4", topic: "The Spirit fills the house", category: church }
              - { to: "Rev 21:22-23", topic: "No temple, for the Lamb is its lamp", category: heaven }
              - { to: "Ezek 43:1-5", topic: "The glory returns to the temple", category: temple }
      - title: "The gate and the courtyard"
        note: "One way in, through a gate of blue, purple and scarlet."

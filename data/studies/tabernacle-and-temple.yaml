# God's house from the gate to the mercy seat. Each part links to where the New Testament
# finds it answered in Christ, in His body the church, and in the sanctuary in heaven,
# and to the same part in Solomon's temple and the temple to come.
id: tabernacle-and-temple
title: "The Tabernacle, the Temple and the Body of Christ"
subtitle: "Every part of God's house, from the gate to the mercy seat, and how Christ, His church and heaven itself answer to it"
kind: connections
chart: map
summary: >-
  "Let them make Me a sanctuary, so that I may dwell among them" (Exodus 25:8). The tent in the
  wilderness and the temple that followed it were built to a pattern shown on the mountain, and
  the New Testament says what the pattern was: the Word who tabernacled among us, the church
  built into a holy temple, and the true sanctuary in heaven. This study walks in from the gate,
  part by part.
tags: [tabernacle, temple, typology, church, worship]
categories:
  christ:
    title: "Fulfilled in Christ"
    note: "Where the New Testament finds the part answered in Jesus Himself."
  church:
    title: "The body of Christ"
    note: "Where the church, or the believer's body, is called God's house or temple."
  heaven:
    title: "The pattern in heaven"
    note: "The heavenly sanctuary the earthly one copied (Hebrews 8:5)."
  temple:
    title: "In the temple"
    note: "The same part in Solomon's temple, the second temple, or Ezekiel's vision."
views:
  - title: "By part"
    note: "Walking in: the house, the gate, the altar, the basin, the Holy Place, the veil, the priests, and the temple to come."
    groups:
      - title: "The house itself"
        note: "A tent for God to dwell in, made to a pattern, filled with glory."
        refs:
          - ref: "Exod 25:8-9"
            label: "Make Me a sanctuary"
            note: "According to the pattern shown you on the mountain"
            links:
              - { to: "John 1:14", topic: "The Word tabernacled among us", category: christ }
              - { to: "Heb 8:1-5", topic: "A copy and shadow of what is in heaven", category: heaven }
              - { to: "1 Cor 3:16-17", topic: "You are God's temple", category: church }
              - { to: "Eph 2:19-22", topic: "Built together into a dwelling for God", category: church }
              - { to: "1 Pet 2:4-5", topic: "Living stones, a spiritual house", category: church }
              - { to: "Rev 21:3", topic: "The dwelling of God is with men", category: heaven }
          - ref: "Exod 26:1-6"
            label: "The curtains with cherubim"

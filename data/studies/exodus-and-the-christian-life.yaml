# The Exodus read as the shape of following Christ: Egypt, the sea, the wilderness, the Jordan,
# and the battles in the land. The New Testament reads the story this way itself
# (1 Corinthians 10, Hebrews 3 and 4, Jude 5), and the links show where.
id: exodus-and-the-christian-life
title: "The Exodus and the Christian Life"
subtitle: "Egypt, the sea, the wilderness, the Jordan and the battles in the land, and how the New Testament reads them as the shape of following Christ"
kind: connections
chart: timeline
timeline:
  from: -1650
  to: -1415
  note: "The apostles' retellings sit fifteen centuries to the right; press fit all to see them."
summary: >-
  "These things happened to them as examples and were written down as warnings for us"
  (1 Corinthians 10:11). Israel's road out of Egypt is the oldest map of the life of faith:
  bondage and a Passover, a sea crossed, a wilderness of provision and testing, a river, and
  a land with battles still in it. Zoom into any stage to see where the New Testament finds
  Christ in it, applies it to the believer's walk, or holds it up as a warning. Notes say when
  a mapping is a long-standing devotional reading rather than a stated one.
tags: [exodus, discipleship, typology, wilderness, promised land]
categories:
  christ:
    title: "Christ in the story"
    note: "Where the New Testament finds Jesus in the Exodus."
  life:
    title: "Our walk"
    note: "Where the New Testament applies the story to the believer and the church."
  warning:
    title: "A warning for us"
    note: "Where the New Testament holds up Israel's failure as a caution."
  echo:
    title: "Retold in Scripture"
    note: "Where the Prophets, the Psalms and the apostles retell the story."
views:
  - title: "By stage"
    note: "Seven stages of the road, from the house of slavery to the land with battles still in it."
    groups:
      - title: "Egypt: the house of slavery"
        note: "Life under a master we did not choose, and the God who hears the groaning."
        refs:
          - ref: "Exod 1:8-14"
            label: "Slaves in Egypt"
            note: "Before deliverance comes a bondage we cannot break ourselves"
            links:
              - { to: "John 8:34-36", topic: "Slaves to sin, set free by the Son", category: life }
              - { to: "Rom 6:16-18", topic: "Slaves to sin, set free by the Son", category: life }
              - { to: "Eph 2:1-3", topic: "Dead in trespasses, following the ruler of this world", category: life }
              - { to: "Titus 3:3", topic: "Once we too were enslaved", category: life }
              - { to: "Deut 5:15", topic: "Remember that you were slaves in Egypt", category: echo }
          - ref: "Exod 2:23-25"
            label: "The groaning"
            note: "Israel groaned, and God heard, remembered, looked, and knew"
            links:
              - { to: "Rom 8:22-27", topic: "Creation groans, and the Spirit groans with us", category: life }
              - { to: "Ps 34:17-18", topic: "The LORD hears the cry of the righteous", category: echo }
              - { to: "Luke 18:7-8", topic: "Will not God bring justice for His elect who cry out?", category: christ }
              - { to: "Exod 3:7-10", topic: "I have surely seen the affliction of My people", category: echo }
          - ref: "Exod 3:1-15"

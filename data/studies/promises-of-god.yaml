  - title: "The great covenants"
    note: "The promises the rest hang on, in the order they were given, and the God who keeps his word."
    groups:
      - title: "To Noah: never again"
        refs:
          - ref: "Gen 8:20-22"
            label: "Seedtime and harvest will never cease"
            facets: { to: all, kept: [already, now], condition: given }
          - ref: "Gen 9:8-17"
            label: "The rainbow: never again a flood to destroy the earth"
            facets: { to: all, kept: [already, now], condition: given }
            links:
              - { to: "Isa 54:9-10", topic: "As I swore to Noah, so I swear to you", category: echo }

      - title: "To Abraham: offspring, land and blessing"
        refs:
          - ref: "Gen 15:1-6"
            label: "Count the stars: so shall your offspring be"
            facets: { to: person, kept: already, condition: given }
            links:
              - { to: "Rom 4:18-22", topic: "Against all hope, Abraham believed", category: us }
          - ref: "Gen 15:12-21"
            label: "God alone passes between the pieces"
            note: "Abraham sleeps; God binds himself to the covenant by himself"
            facets: { to: person, kept: already, condition: given }
          - ref: "Gen 21:1-3"
            label: "The LORD did for Sarah what He had promised"
            facets: { to: person, kept: already, condition: given }
          - ref: "Gen 22:15-18"
            label: "By Myself I have sworn"
            facets: { to: person, kept: [already, christ], condition: given }
            links:
              - { to: "Heb 6:13-20", topic: "Two unchangeable things: his promise and his oath", category: us }
              - { to: "Gal 3:16", topic: "The seed is Christ", category: christ }
              - { to: "Gal 3:29", topic: "If you belong to Christ, you are Abraham's heirs", category: us }

      - title: "To Israel at Sinai: if you obey"
        note: "The one great covenant hung on a condition, and the one Israel broke."
        refs:
          - ref: "Exod 19:3-6"
            label: "If you will indeed obey My voice, you will be My treasured possession"
            facets: { to: israel, kept: already, condition: ifthen }
            links:
              - { to: "1 Pet 2:9-10", topic: "A chosen people, a royal priesthood", category: us }
          - ref: "Lev 26:3-13"
            label: "If you follow My statutes: rain, harvest, peace, My dwelling among you"
            facets: { to: israel, kept: already, condition: ifthen }
          - ref: "Deut 28:1-14"
            label: "All these blessings will come upon you and overtake you"
            facets: { to: israel, kept: already, condition: ifthen }
          - ref: "Deut 30:1-10"
            label: "The LORD will circumcise your heart"
            note: "Beyond the exile: return, and a heart able to love him"
            facets: { to: israel, kept: [already, christ], condition: ifthen }

      - title: "To David: a throne that lasts"
        refs:
          - ref: "2 Sam 7:8-16"
            label: "Your throne will be established forever"
            facets: { to: person, kept: [already, christ], condition: given }
            links:
              - { to: "Luke 1:30-33", topic: "The throne of his father David", category: christ }
              - { to: "Acts 2:29-36", topic: "Peter: God swore to seat one of David's descendants", category: christ }
          - ref: "Ps 89:3-4, 28-37"
            label: "I will not violate My covenant"
            facets: { to: person, kept: [already, christ], condition: given }
          - ref: "Ps 132:11-12"
            label: "If your sons keep My covenant"
            facets: { to: person, kept: already, condition: ifthen }
          - ref: "Isa 9:6-7"
            label: "Of the increase of His government and peace there will be no end"
            facets: { to: israel, kept: [christ, notyet], condition: given }
            links:
              - { to: "Rev 22:16", topic: "The Root and the Offspring of David", category: christ }

      - title: "The new covenant"
        refs:
          - ref: "Jer 31:31-34"
            label: "I will write My law on their hearts and remember their sins no more"
            facets: { to: israel, kept: [christ, now], condition: given }
            links:
              - { to: "Heb 8:6-13", topic: "A better covenant, on better promises", category: christ }
              - { to: "Heb 10:15-18", topic: "Their sins remembered no more", category: us }
          - ref: "Ezek 37:26-27"

          - ref: "2 Cor 3:4-6"
            label: "Ministers of a new covenant, of the Spirit"
            facets: { to: believers, kept: now, condition: given }

      - title: "The God who keeps his word"
        note: "Not promises themselves, but why the promises hold. These carry no tags, so the counts stay to the promises."
        refs:
          - ref: "Num 23:19"
            label: "God is not a man, that He should lie"
          - ref: "Josh 21:43-45"
            label: "Not one of all the LORD's good promises failed"
          - ref: "1 Kgs 8:54-56"
            label: "Not one word has failed of all His good promises"
          - ref: "Isa 55:10-11"
            label: "My word will not return to Me empty"
          - ref: "Ps 145:13"
            label: "The LORD is faithful in all His words"
          - ref: "Rom 4:20-21"
            label: "Fully persuaded that God was able to do what He had promised"
          - ref: "2 Cor 1:20-22"
            label: "For all the promises of God are Yes in Christ"
          - ref: "Heb 10:23"
            label: "He who promised is faithful"
          - ref: "1 Thess 5:23-24"
            label: "The One who calls you is faithful, and He will do it"
          - ref: "2 Pet 3:8-9"
            label: "The Lord is not slow in keeping His promise"

  - title: "When it is kept"
    note: "Every promise above, grouped by when it is kept. Many are kept in more than one way, so they appear more than once."
    auto: facet
    facet: kept
  - title: "Who it is for"
    auto: facet
    facet: to
  - title: "With or without an if"
    auto: facet
    facet: condition

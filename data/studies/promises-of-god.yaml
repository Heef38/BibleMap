# The promises of God: what he promises, who he promised it to, whether a condition is attached,
# and when it is kept (already in the story, in Christ, in us now, or still to come). Every promise
# carries those three tags so the Patterns chart can count them. Not every promise in Scripture is
# here; these are the ones the rest lean on.
id: promises-of-god
title: "The Promises of God"
subtitle: "What he promises, who to, on what condition, and when it is kept: already, in Christ, in us now, or still to come"
kind: connections
chart: map
added: "2026-09-19"
summary: >-
  "For all the promises of God are 'Yes' in Christ" (2 Corinthians 1:20). This study gathers the
  promises by what they promise, from his presence to the resurrection, and puts the great
  covenants behind them: to Noah, to Abraham, to Israel at Sinai, to David, and the new covenant.
  Each promise is tagged with who it was made to, whether it comes with a condition, and when it
  is kept, so the Patterns chart can count how many are already fulfilled, how many are being kept
  in us now, and how many are still to come. Tags follow the words of the text; notes say where a
  promise made to Israel is taken up for the church.
tags: [promises, covenant, faithfulness, hope, assurance]
categories:
  christ:
    title: "Fulfilled in Christ"
    note: "Where the New Testament says Jesus keeps the promise."
  kept:
    title: "Kept in the story"
    note: "Where Scripture records the promise coming true."
  us:
    title: "Taken up for us"
    note: "Where the letters apply the promise to believers."
  echo:
    title: "Said again"
    note: "Where Scripture repeats or enlarges the promise."
facetUnit: promises
facets:
  to:
    title: "Who it was made to"
    note: "The people the promise is spoken to in its own setting."
    values:
      person: { title: "One person", note: "Abraham, Joshua, David and others, by name." }
      israel: { title: "Israel" }
      believers: { title: "Everyone who believes" }
      all: { title: "All people and creation" }
  kept:
    title: "When it is kept"
    note: "One promise can be kept in more than one way: begun in Christ, worked out in us now, finished when he comes."
    values:
      already: { title: "Already, in the story", note: "Kept within the Old Testament account itself." }
      christ: { title: "Fulfilled in Christ" }
      now: { title: "Kept in us now" }
      notyet: { title: "Still to come" }
  condition:
    title: "Is a condition attached?"
    note: "Whether the passage itself attaches an if: faith, obedience, asking, repentance, waiting."
    values:
      ifthen: { title: "Comes with an if" }
      given: { title: "Given with no condition" }
views:
  - title: "By what is promised"
    note: "Eight things God promises, from his presence to the life of the age to come."
    groups:
      - title: "His presence and help"
        refs:
          - ref: "Gen 28:13-15"
            label: "I am with you and will watch over you"
            note: "To Jacob, running from home"
            facets: { to: person, kept: already, condition: given }
          - ref: "Exod 33:14"
            label: "My Presence will go with you, and I will give you rest"
            facets: { to: person, kept: already, condition: given }
          - ref: "Josh 1:5-9"
            label: "I will never leave you nor forsake you"
            facets: { to: person, kept: already, condition: given }
            links:
              - { to: "Heb 13:5-6", topic: "The same words, said to us", category: us }
          - ref: "Isa 41:10"
            label: "Do not fear, for I am with you"
            facets: { to: israel, kept: now, condition: given }
          - ref: "Matt 28:18-20"
            label: "I am with you always, to the end of the age"
            facets: { to: believers, kept: now, condition: given }
          - ref: "John 14:16-18"
            label: "Another Advocate, to be with you forever"
            note: "\"I will not leave you as orphans\""
            facets: { to: believers, kept: [christ, now], condition: given }
          - ref: "Deut 31:6-8"
            label: "The LORD goes with you; He will never leave you"
            facets: { to: israel, kept: already, condition: given }

      - title: "Forgiveness and a new heart"

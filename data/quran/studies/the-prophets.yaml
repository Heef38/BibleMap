# The prophets of the Quran, one by one, with the Bible passage that tells the same story where
# there is one. Each story is tagged on `told`: whether the Bible tells it too, whether Jewish or
# Christian writings outside the Bible tell it, or whether it is known only from the Quran. The
# notes name those writings and roughly when they were written, and say where the Quran and the
# Bible differ. A second view follows the one pattern the Quran's punishment stories share.
# Quotations follow Talal Itani's translation.
id: the-prophets
title: "The Prophets and Their Stories"
subtitle: "Adam to Jesus as the Quran tells them: who is in the Bible, who is not, what is told differently, and the one pattern the stories share"
kind: connections
chart: patterns
added: "2026-09-30"
summary: >-
  More of the Quran is given to the stories of earlier prophets than to any other subject but
  God and the Last Day. Muslims count twenty-five prophets named in it. Nineteen are familiar
  from the Bible: Adam, Noah, Abraham, Lot, Ishmael, Isaac, Jacob, Joseph, Moses, Aaron, David,
  Solomon, Elijah, Elisha, Job, Jonah, Zechariah, John and Jesus. Idris is taken to be Enoch,
  and Dhul-Kifl is uncertain. Three are Arabian and unknown to the Bible (Hud, Salih and
  Shuayb), and Muhammad is the last, the “seal of the prophets.” The Quran does not tell
  their lives in order, as Genesis to Kings does. It tells scenes, often more than once and in
  different words, and it tells them for a reason it states itself: “to strengthen your heart”
  (11:120). Again and again the story is Muhammad's own: a man sent to his own people with the
  message that there is no god but God, mocked and threatened, and vindicated when God destroys
  those who refused. Where the Bible has the same story, the link opens it on Bible-Map. Many
  details differ, and some episodes are known from Jewish and Christian writings outside the
  Bible; the notes say which. The Patterns chart counts how many of the stories fall each way.
tags: [prophets, messengers, adam, noah, abraham, moses, joseph, david, solomon, jonah, stories]
categories:
  retold:
    title: "Told again"
    note: "The same scene in another surah."
facetUnit: stories
facets:
  told:
    title: "Where else it is told"
    note: "A story can be in the Bible and also in later writings that fill it out."
    values:
      bible: { title: "In the Bible too", note: "The Bible tells the same person or event, whatever the differences in detail." }
      lore: { title: "In Jewish or Christian writings outside the Bible", note: "Midrash, Talmud, apocryphal gospels, legends of saints and of Alexander. The notes name them." }
      quran: { title: "Known only from the Quran", note: "No earlier writing tells it: above all the three Arabian prophets." }
views:
  - title: "Prophet by prophet"
    note: "In the order of the Bible's story, from Adam to Jesus, with the Quran's own summary of the line first."
    groups:
      - title: "The line of the prophets"
        note: "The Quran counts the prophets as one line, all bringing one message, and says it has not named them all."
        refs:
          - ref: "6:83-90"
            label: "Eighteen names in one passage"
            note: "Abraham, Isaac, Jacob, Noah, David, Solomon, Job, Joseph, Moses, Aaron, Zechariah, John, Jesus, Elias, Ishmael, Elisha, Jonah and Lot: “those are they whom God has guided, so follow their guidance.” Talal Itani writes “Elias” for Ilyas and “Elijah” for al-Yasa (Elisha) here, but “Elijah” for Ilyas in 37:123."
          - ref: "4:163-165"
            label: "“Some messengers We have not told you about”"
            note: "“We have inspired you, as We had inspired Noah and the prophets after him … And God spoke to Moses directly.”"
          - ref: "2:136"
            label: "“We make no distinction between any of them”"
          - ref: "2:253"
            label: "“We gave some advantage over others”"
            note: "To some God spoke; to Jesus He gave clear miracles and the Holy Spirit."
          - ref: "33:40"
            label: "Muhammad, “the seal of the prophets”"
            note: "The last of the line, by the common Muslim reading."
            facets: { told: quran }

      - title: "Adam"
        note: "The first man and, in the Quran, the first prophet, taught by God himself."
        refs:
          - ref: "2:30-33"
            label: "A successor on earth, taught the names"
            note: "The angels object that man will shed blood; God teaches Adam “the names, all of them,” which the angels do not know. Adam naming the animals is in Genesis; the angels' objection is in the Talmud and Midrash (Sanhedrin 38b, Genesis Rabbah 8)."
            bible: "Gen 2:19-20"
            facets: { told: [bible, lore] }
          - ref: "7:11-18"
            label: "Satan will not bow down"
            note: "“I am better than he; You created me from fire, and You created him from mud.” Satan asks for respite until the resurrection, to lead people astray. The story is told seven times (2, 7, 15, 17, 18, 20, 38). It is not in the Bible; the Life of Adam and Eve, an early Jewish or Christian writing (first centuries AD), tells of Satan refusing to worship Adam."
            facets: { told: lore }
            links:
              - { to: "2:34", category: retold, topic: "The same refusal" }
              - { to: "15:28-35", category: retold, topic: "The same refusal" }
              - { to: "17:61-65", category: retold, topic: "The same refusal" }
              - { to: "18:50", category: retold, topic: "The same refusal" }
              - { to: "20:116", category: retold, topic: "The same refusal" }
              - { to: "38:71-85", category: retold, topic: "The same refusal" }
          - ref: "7:19-25"
            label: "The tree, the fall and the pardon"
            note: "There is no serpent: Satan tempts Adam and his wife together, “lest you become angels, or become immortals.” They eat, see their nakedness, cover themselves with leaves, and say, “Our Lord, we have done wrong to ourselves.” God forgives Adam (2:37, 20:122), yet sends them down to earth. The Quran does not name Eve, and does not speak of their sin passing to their children."
            bible: "Gen 3:1-24"
            facets: { told: bible }
            links:
              - { to: "2:35-39", category: retold, topic: "The fall, told again" }
              - { to: "20:115-123", category: retold, topic: "The fall, told again" }
          - ref: "5:27-32"
            label: "The two sons of Adam"
            note: "Unnamed here; tradition calls them Qabil and Habil. The one who will not raise his hand, the raven that shows the killer how to bury his brother, and the lesson drawn “for the Children of Israel”: whoever kills a person “it is as if he killed the whole of mankind.” That saying is in the Mishnah (Sanhedrin 4:5, about AD 200); the raven is in later Jewish tradition."
            bible: "Gen 4:1-16"
            facets: { told: [bible, lore] }

      - title: "Idris (Enoch)"
        refs:
          - ref: "19:56-57"
            label: "“We raised him to a high position”"
            note: "The Arabic name is Idris; Muslim tradition identifies him with Enoch, and Itani writes “Enoch.” Genesis says Enoch “walked with God, and then he was no more, because God had taken him away.”"
            bible: "Gen 5:21-24"
            facets: { told: bible }

      - title: "Noah"
        note: "The Quran's Noah is above all a preacher, warning his people for centuries before the Flood."
        refs:
          - ref: "11:25-49"
            label: "The Ark, and the son who would not board"
            note: "Noah warns, is mocked as he builds, and saves a pair of every kind with the few who believed. One son refuses, “I will take refuge on a mountain,” and drowns; God tells Noah, “he is not of your family.” The son is not in Genesis. The Ark comes to rest on Judi, not Ararat. “The volcano erupted” (11:40) is Itani's rendering; the Arabic says the oven, or the earth's surface, boiled over."
            bible: "Gen 6:5-9:17"
            facets: { told: bible }
            links:
              - { to: "7:59-64", category: retold, topic: "Noah, told again" }
              - { to: "23:23-30", category: retold, topic: "Noah, told again" }
              - { to: "26:105-122", category: retold, topic: "Noah, told again" }
              - { to: "54:9-17", category: retold, topic: "Noah, told again" }
          - ref: "71:1-28"
            label: "Surah Noah: “I have called my people night and day”"
            note: "A whole surah of Noah's preaching, ending with his prayer: “do not leave of the unbelievers a single dweller on earth.” Genesis gives Noah no words before the Flood; 2 Peter calls him “a preacher of righteousness,” and Jewish tradition tells of his warnings."
            bible: "2 Pet 2:5"
            facets: { told: [bible, lore] }
          - ref: "29:14-15"
            label: "“A thousand years minus fifty”"
            note: "His time among his people. In Genesis, 950 years is his whole life."
            bible: "Gen 9:28-29"
            facets: { told: bible }
          - ref: "66:10"
            label: "The wives of Noah and Lot"
            note: "Held up as examples of unbelief: “they betrayed them … and it was said, ‘Enter the Fire.’” Genesis says nothing against Noah's wife."
            facets: { told: quran }

      - title: "Hud and the people of Aad"
        note: "An Arabian prophet unknown to the Bible, sent to Aad, a people of great strength and tall buildings."
        refs:
          - ref: "7:65-72"
            label: "“Their brother Hud”"
            note: "“Did you come to us to make us worship God alone, and abandon what our ancestors used to worship?” God “cut off the roots” of those who refused."
            facets: { told: quran }
          - ref: "11:50-60"
            label: "“Some of our gods have possessed you with evil”"
            facets: { told: quran }
          - ref: "46:21-26"
            label: "The cloud they took for rain"
            note: "At the dunes: “This is a cloud that will bring us rain.” It was “a wind in which is grievous suffering.”"
            facets: { told: quran }

      - title: "Salih and the she-camel of Thamud"
        note: "The second Arabian prophet, sent to Thamud, who carved their houses in the rock."
        refs:
          - ref: "7:73-79"
            label: "“This she-camel of God is a sign for you”"
            note: "They hamstrung her, “and the quake overtook them.”"
            facets: { told: quran }
          - ref: "11:61-68"
            label: "Three days, then the Scream"
            facets: { told: quran }
          - ref: "91:11-15"
            label: "“So their Lord crushed them for their sin”"
            facets: { told: quran }

      - title: "Abraham"
        note: "After Moses, the prophet the Quran speaks of most: the man who broke with his father's idols, the builder with Ishmael of the House at Mecca, and the model of pure faith that was “neither a Jew nor a Christian.”"
        refs:
          - ref: "6:74-79"
            label: "Star, moon and sun: “I do not love those that set”"
            note: "Abraham looks for his Lord in the sky and turns from each light as it sets. The Book of Jubilees (second century BC) and later Jewish writings also tell of Abraham reasoning from the stars to their Maker."
            facets: { told: lore }
          - ref: "21:51-70"
            label: "The broken idols and the fire"
            note: "He smashes the idols but the biggest, and says, “it was this biggest of them that did it. Ask them.” They throw him into a fire, and God says, “O fire, be coolness and safety upon Abraham.” Neither story is in the Bible, which says only that Abraham's fathers “worshiped other gods”; both are in the Midrash Genesis Rabbah (fifth century)."
            bible: "Josh 24:2"
            facets: { told: lore }
            links:
              - { to: "37:83-98", category: retold, topic: "The idols, told again" }
              - { to: "29:16-25", category: retold, topic: "The idols, told again" }
          - ref: "19:41-50"
            label: "“O my father, why do you worship what can neither hear, nor see?”"
            note: "His father, Azar in 6:74 (Terah in the Bible), threatens to stone him. Abraham promises to pray for him, and later disowns him (9:114)."
            bible: "Gen 11:26-32"
            facets: { told: [bible, lore] }
          - ref: "2:258"
            label: "The king who said, “I give life and cause death”"
            note: "“God brings the sun from the East, so bring it from the West.” Jewish tradition names the king Nimrod."
            facets: { told: lore }
          - ref: "2:260"
            label: "Four birds on four hills"
            note: "Abraham asks to see how God gives life to the dead. Some compare Genesis 15, where he asks for a sign and cuts animals in two, with birds."
            bible: "Gen 15:8-11"
            facets: { told: bible }
          - ref: "11:69-76"
            label: "The guests, Sarah's laughter, and Lot's people"
            note: "Messengers bring news of Isaac, “and after Isaac, Jacob”; his wife laughs; Abraham pleads for Lot's people. In Genesis the guests eat; here they do not touch the calf, and Abraham fears them."
            bible: "Gen 18:1-33"
            facets: { told: bible }
            links:
              - { to: "15:51-60", category: retold, topic: "The guests, told again" }
              - { to: "51:24-37", category: retold, topic: "The guests, told again" }
          - ref: "37:99-111"
            label: "The sacrifice of his son"
            note: "“O My son, I see in a dream that I am sacrificing you.” “O my Father, do as you are commanded.” God redeems him “with a great sacrifice.” The son is not named; Isaac's birth is announced after (37:112), so most Muslims today hold it was Ishmael, though early Muslim scholars were divided. Genesis names Isaac."
            bible: "Gen 22:1-19"
            facets: { told: bible }
          - ref: "2:124-129"
            label: "Abraham and Ishmael raise the House"
            note: "The Kaaba at Mecca, with a prayer for a messenger to come from their descendants. Muslims read that prayer as fulfilled in Muhammad. The Bible has Hagar and Ishmael sent into the wilderness of Paran, but nothing of Abraham in Arabia."
            bible: "Gen 21:8-21"
            facets: { told: quran }
          - ref: "14:35-41"
            label: "“A valley of no vegetation, by Your Sacred House”"
            note: "Abraham's prayer for the offspring he settled at Mecca, and thanks for “Ishmael and Isaac” in his old age."
            facets: { told: quran }
          - ref: "3:65-68"
            label: "“Abraham was neither a Jew nor a Christian”"
            note: "“The Torah and the Gospel were not revealed until after him.” Paul makes a related argument: Abraham was counted righteous before circumcision and the Law, and so is father of all who believe."
            bible: "Rom 4:9-16"
            facets: { told: quran }
          - ref: "16:120-123"
            label: "“Follow the religion of Abraham”"
            facets: { told: quran }

      - title: "Lot"
        note: "In the Quran, a messenger to his own people, not only Abraham's nephew."
        refs:
          - ref: "11:77-83"
            label: "The guests, the daughters, the stones of baked clay"
            note: "“These are my daughters; they are purer for you.” The messengers tell him to leave by night, without his wife, and the town is turned upside down. Genesis tells of Lot's daughters in the cave after; the Quran does not."
            bible: "Gen 19:1-29"
            facets: { told: bible }
            links:
              - { to: "7:80-84", category: retold, topic: "Lot, told again" }
              - { to: "15:61-77", category: retold, topic: "Lot, told again" }
              - { to: "26:160-175", category: retold, topic: "Lot, told again" }
              - { to: "29:28-35", category: retold, topic: "Lot, told again" }

      - title: "Ishmael, Isaac and Jacob"
        refs:
          - ref: "19:54-55"
            label: "Ishmael, “a messenger, a prophet”"
            note: "The Bible does not call him a prophet."
            facets: { told: quran }
          - ref: "2:132-133"
            label: "Jacob's sons at his deathbed: “We will worship your God”"
            note: "“The God of your fathers, Abraham, Ishmael, and Isaac; One God.” Genesis gives Jacob's last words to his sons; the Talmud (Pesachim 56a) has his sons answer him with the Shema."
            bible: "Gen 49:1-33"
            facets: { told: [bible, lore] }

      - title: "Joseph"
        note: "The one story the Quran tells whole, in a surah of its own: “the most accurate history” (12:3)."
        refs:
          - ref: "12:4-20"
            label: "The dream and the well"
            note: "Eleven planets, the sun and the moon bow down. His brothers throw him in a well and bring back his shirt with false blood."
            bible: "Gen 37:1-36"
            facets: { told: bible }
          - ref: "12:23-29"
            label: "The master's wife"
            note: "She tears his shirt from behind as he runs for the door; a witness says that proves him innocent, and her husband believes it. In Genesis Joseph leaves his garment in her hand and is jailed."
            bible: "Gen 39:6-20"
            facets: { told: bible }
          - ref: "12:30-35"
            label: "The women who cut their hands"
            note: "At her banquet the women of the city see Joseph and cut their hands with their knives: “this is not a human, this must be a precious angel.” Not in the Bible; also told in Jewish tradition (Midrash Tanhuma)."
            facets: { told: lore }
          - ref: "12:36-57"
            label: "Prison, the king's dream, and the storehouses"
            bible: "Gen 40:1-41:57"
            facets: { told: bible }
          - ref: "12:58-92"
            label: "The brothers come to Egypt"
            note: "The cup in Benjamin's bag, and “I am Joseph.” Jacob goes blind with grief (12:84)."
            bible: "Gen 42:1-45:15"
            facets: { told: bible }
          - ref: "12:93-101"
            label: "The shirt, the sight restored, the dream fulfilled"
            note: "Joseph's shirt laid on Jacob's face restores his sight, and “he elevated his parents on the throne, and they fell prostrate before him.” In Genesis Joseph's mother Rachel had died long before."
            bible: "Gen 45:25-46:7; Gen 50:15-21"
            facets: { told: bible }

      - title: "Shuayb and Midian"
        note: "The third Arabian prophet, sent to Midian over cheating in weights and measures. Later tradition identified him with Jethro, Moses' father-in-law; the Quran does not."
        refs:
          - ref: "11:84-95"
            label: "“Give full measure and full weight”"
            note: "“Were it not for your tribe, we would have stoned you.” The Blast struck them, “as though they never flourished therein.”"
            facets: { told: quran }
            links:
              - { to: "7:85-93", category: retold, topic: "Shuayb, told again" }
              - { to: "26:176-191", category: retold, topic: "Shuayb, told again" }

      - title: "Moses"
        note: "The prophet named most often in the Quran, 136 times in 34 surahs. His story is told in pieces, and it runs closest to Muhammad's own: a prophet sent to a tyrant, who leads his people out and gives them a law."
        refs:
          - ref: "28:3-13"
            label: "The baby in the river"
            note: "His mother casts him into the river and Pharaoh's household picks him up; Pharaoh's wife (in Exodus, Pharaoh's daughter) says, “Do not kill him.” Haman appears at Pharaoh's side (28:6); in the Bible Haman is a Persian official in the book of Esther, centuries later."
            bible: "Exod 2:1-10"
            facets: { told: bible }
          - ref: "28:15-28"
            label: "The killing, the flight to Midian, the marriage"
            note: "Moses kills an Egyptian with a blow and asks forgiveness. In Midian he waters two women's flocks and marries one for eight or ten years' work, as Jacob worked for Laban."
            bible: "Exod 2:11-22"
            facets: { told: bible }
          - ref: "20:9-24"
            label: "The fire, the sacred valley, the staff"
            note: "“I—I am your Lord. Take off your shoes. You are in the sacred valley of Tuwa. … I—I am God. There is no God but I.”"
            bible: "Exod 3:1-4:17"
            facets: { told: bible }
            links:
              - { to: "27:7-12", category: retold, topic: "The call, told again" }
              - { to: "28:29-35", category: retold, topic: "The call, told again" }
          - ref: "7:103-126"
            label: "Pharaoh's magicians believe"
            note: "The staff swallows their tricks; the magicians fall down and believe, and Pharaoh threatens to cut off their hands and feet and crucify them. In Exodus the magicians say, “This is the finger of God,” but do not convert."
            bible: "Exod 7:8-13; Exod 8:16-19"
            facets: { told: bible }
            links:
              - { to: "20:56-76", category: retold, topic: "The magicians, told again" }
              - { to: "26:10-51", category: retold, topic: "The magicians, told again" }
          - ref: "7:130-137"
            label: "The plagues and the sea"
            note: "Barren years, then “the flood, and the locusts, and the lice, and the frogs, and blood.” 17:101 speaks of nine signs; Exodus has ten plagues."
            bible: "Exod 7:14-12:32; Exod 14:21-31"
            facets: { told: bible }
          - ref: "10:90-92"
            label: "Pharaoh believes as he drowns"
            note: "“I believe that there is no god except the One the Children of Israel believe in.” “Now?” His body is preserved “so that you become a sign for those after you.”"
            bible: "Exod 14:26-28"
            facets: { told: [bible, lore] }
          - ref: "7:142-145"
            label: "Forty nights, the mountain, the Tablets"
            note: "Moses asks to see God: “You will not see Me, but look at the mountain.” It turns to dust. In Exodus God shows Moses His back, “but My face must not be seen.”"
            bible: "Exod 24:18; Exod 33:18-23; Exod 34:1-28"
            facets: { told: bible }
          - ref: "2:63"
            label: "The mountain raised over them"
            note: "The covenant taken with Sinai lifted above the people. The Talmud (Shabbat 88a) says God held the mountain over them like a barrel."
            facets: { told: lore }
          - ref: "20:83-98"
            label: "The calf that lowed, and the Samiri"
            note: "Here a man called as-Samiri makes the calf, “a mere body which lowed,” and Aaron tries to stop the people; in Exodus Aaron makes it. Itani's “the Samarian” reads the name as “the Samaritan”; commentators give other explanations."
            bible: "Exod 32:1-35"
            facets: { told: [bible, lore] }
            links:
              - { to: "7:148-153", category: retold, topic: "The calf, told again" }
          - ref: "2:67-73"
            label: "The heifer"
            note: "The people haggle over which cow to sacrifice; a piece of it laid on a murdered man reveals his killer. Deuteronomy commands a heifer's neck broken for an unsolved killing; Numbers, the red heifer."
            bible: "Deut 21:1-9; Num 19:1-10"
            facets: { told: bible }
          - ref: "5:20-26"
            label: "“Go ahead, you and your Lord, and fight”"
            note: "The people refuse to enter the Holy Land, and wander forty years. The two faithful men are Joshua and Caleb in Numbers."
            bible: "Num 13:25-14:35"
            facets: { told: bible }
          - ref: "28:76-82"
            label: "Korah and his treasures"
            note: "Proud of riches whose keys “would weigh down a group of strong men,” he is swallowed by the earth. In Numbers Korah's sin is rebellion against Moses; the Talmud (Pesachim 119a) also tells of his great wealth and its keys."
            bible: "Num 16:1-35"
            facets: { told: [bible, lore] }
          - ref: "40:36-37"
            label: "“O Hamaan, build me a tower”"
            note: "Pharaoh's order to his minister to build a tower to look at the God of Moses (also 28:38, with fired bricks). The Bible's tower of fired brick is Babel's."
            bible: "Gen 11:3-4"
            facets: { told: quran }
          - ref: "18:60-82"
            label: "Moses and the servant of God"
            note: "Moses follows a man taught “knowledge from Our Own” (tradition calls him al-Khidr), who holes a boat, kills a boy and mends a wall, and then explains. No such story of Moses is in the Bible. A dried fish that comes alive at a spring is also told of Alexander the Great in the Alexander romance; a sage whose strange acts are explained afterward has a Jewish counterpart about Elijah, known from later writings."
            facets: { told: lore }

      - title: "David, Saul and Solomon"
        refs:
          - ref: "2:246-251"
            label: "Saul, Goliath and the river"
            note: "Israel asks a prophet for a king; God appoints Saul, and the Ark returns carried by angels. Saul tests his army at a river; the few who do not drink fight, “and David killed Goliath.” In the Bible the test at the water is Gideon's."
            bible: "1 Sam 8:4-22; 1 Sam 17:1-58; Judg 7:4-7"
            facets: { told: bible }
          - ref: "38:17-26"
            label: "David and the two disputants"
            note: "“This brother of mine has ninety nine ewes, and I have one ewe.” David sees that he is being tested, and repents. It is Nathan's parable in 2 Samuel, told to convict David of taking Bathsheba; the Quran names no sin."
            bible: "2 Sam 12:1-13"
            facets: { told: bible }
          - ref: "34:10-11"
            label: "Mountains and birds sing with him; iron is softened"
            note: "David makes coats of mail (also 21:79-80)."
            bible: "Ps 148:7-10"
            facets: { told: quran }
          - ref: "27:15-44"
            label: "Solomon, the ant, the hoopoe and the queen of Sheba"
            note: "Solomon understands the birds; a hoopoe brings news of a sun-worshiping queen; her throne is brought “before your glance returns to you”; she mistakes a glass floor for water, and submits “with Solomon, to God.” Kings tells of her visit and her questions; the hoopoe's letter and the glass floor are in the Targum Sheni to Esther, a Jewish work of uncertain date."
            bible: "1 Kgs 10:1-13"
            facets: { told: [bible, lore] }
          - ref: "34:12-14"
            label: "The jinn who worked for Solomon"
            note: "They built for him until he died leaning on his staff, and did not notice until a worm ate through it. The Talmud (Gittin 68) tells of demons put to work building the Temple."
            facets: { told: lore }
          - ref: "2:102"
            label: "“It was not Solomon who disbelieved”"
            note: "The magic taught under his name came from devils, and from the two angels Harut and Marut in Babylon."
            facets: { told: lore }

      - title: "Elijah, Job and Jonah"
        refs:
          - ref: "37:123-132"
            label: "Elijah: “Do you call on Baal?”"
            bible: "1 Kgs 18:17-40"
            facets: { told: bible }
          - ref: "38:41-44"
            label: "Job: “Satan has afflicted me”"
            note: "He stamps his foot and finds water; his family is restored “and their like with them.” The Quran's Job is simply patient; the long debate with his friends is not told."
            bible: "Job 1:13-22; Job 42:10-17"
            facets: { told: bible }
            links:
              - { to: "21:83-84", category: retold, topic: "Job, told again" }
          - ref: "37:139-148"
            label: "Jonah, the fish and the gourd"
            note: "He flees to a ship, is swallowed, praises God, is cast out sick under a gourd, and is sent to “a hundred thousand, or more,” who believe. 10:98 calls his the one town that believed and was spared."
            bible: "Jonah 1:1-4:11"
            facets: { told: bible }
            links:
              - { to: "21:87-88", category: retold, topic: "Jonah, told again" }
              - { to: "68:48-50", category: retold, topic: "Jonah, told again" }
              - { to: "10:98", category: retold, topic: "Jonah, told again" }

      - title: "Zechariah, John and Jesus"
        note: "The Quran's last prophets before Muhammad. Jesus and Mary have a study of their own."
        refs:
          - ref: "19:2-15"
            label: "Zechariah is given John"
            note: "An old man and a barren wife; “a name We have never given before”; a sign of three nights' silence. In Luke Zechariah is mute until the birth, and no relative bears the name John."
            bible: "Luke 1:5-25; Luke 1:57-80"
            facets: { told: bible }
            links:
              - { to: "3:38-41", category: retold, topic: "Zechariah, told again" }
          - ref: "19:30-33"
            label: "Jesus in the cradle: “I am the servant of God”"
            note: "The newborn speaks to defend his mother. Christian writings outside the Bible (the Syriac and Arabic infancy gospels) also have the infant Jesus speak."
            bible: "Luke 2:1-20"
            facets: { told: [bible, lore] }

      - title: "Others the Quran tells of"
        note: "Two stories of the eighteenth surah, of figures who are not called prophets."
        refs:
          - ref: "18:9-26"
            label: "The sleepers in the cave"
            note: "Believing youths hide from their people and sleep “three hundred years, adding nine.” It is the Christian legend of the Seven Sleepers of Ephesus, known from the fifth century; the Quran leaves their number to God."
            facets: { told: lore }
          - ref: "18:83-98"
            label: "Dhul-Qarnayn and the wall against Gog and Magog"
            note: "“The two-horned one” travels to where the sun sets “in a murky spring,” then east, and builds an iron wall against Gog and Magog. Most commentators have taken him to be Alexander the Great; a Syriac Christian legend of Alexander from about the same years tells of the same journey and the same gate."
            bible: "Ezek 38:1-6"
            facets: { told: lore }

  - title: "The pattern of the punishment stories"
    note: "Surahs 7, 11 and 26 tell Noah, Hud, Salih, Lot and Shuayb one after another in nearly the same words. Read side by side, the stories share one shape, and the Quran says why it tells them."
    groups:
      - title: "A brother sent to his own people"
        note: "Each messenger is one of his people, “their brother.”"
        refs:
          - { ref: "7:65", label: "“And to Aad, their brother Hud”" }
          - { ref: "7:73", label: "“And to Thamood, their brother Saleh”" }
          - { ref: "7:85", label: "“And to Median, their brother Shuaib”" }
          - { ref: "26:106-108", label: "“Their brother Noah said to them, ‘Do you not fear?’”" }
      - title: "One message: worship God alone"
        refs:
          - { ref: "7:59", label: "“Worship God; you have no god other than Him”" }
          - { ref: "11:61", label: "Salih: “Seek His forgiveness, and repent to Him”" }
          - { ref: "71:2-4", label: "Noah: “I am to you a clear warner”" }
          - { ref: "46:21", label: "Hud: “Worship none but God”" }
      - title: "“I ask of you no payment”"
        refs:
          - { ref: "26:109", label: "Noah" }
          - { ref: "26:127", label: "Hud" }
          - { ref: "26:145", label: "Salih" }
          - { ref: "26:164", label: "Lot" }
          - { ref: "26:180", label: "Shuayb" }
      - title: "The people refuse"
        note: "Only a man like us; only the lowliest follow you; our fathers' gods; bring on what you threaten."
        refs:
          - { ref: "11:27", label: "“Nothing but a man like us”" }
          - { ref: "7:70", label: "“Abandon what our ancestors used to worship?”" }
          - { ref: "26:153-154", label: "“You are surely one of the bewitched”" }
          - { ref: "11:91", label: "“Were it not for your tribe, we would have stoned you”" }
          - { ref: "7:77", label: "“Bring upon us what you threaten us with”" }
      - title: "Punishment falls"
        refs:
          - { ref: "7:64", label: "Noah's people drowned" }
          - { ref: "46:24-25", label: "Aad: a wind" }
          - { ref: "7:78", label: "Thamud: the quake" }
          - { ref: "11:82-83", label: "Lot's town: stones of baked clay" }
          - { ref: "11:94-95", label: "Midian: the Blast" }
          - { ref: "29:40", label: "“Each We seized by his sin”" }
      - title: "The believers are saved"
        refs:
          - { ref: "7:72", label: "“So We saved him and those with him”" }
          - { ref: "11:66", label: "Salih and those who believed" }
          - { ref: "26:170-171", label: "Lot and his family, except an old woman" }
      - title: "Why the stories are told"
        refs:
          - ref: "11:120"
            label: "“To strengthen your heart”"
            note: "“Everything We narrate to you of the history of the messengers is to strengthen your heart therewith.”"
          - ref: "12:111"
            label: "“Not a fabricated tale”"
            note: "“… but a confirmation of what came before it.”"
          - ref: "11:100-102"
            label: "“We did not wrong them, but they wronged themselves”"
          - ref: "7:101-102"
            label: "“These towns—We narrate to you some of their tales”"

  - title: "Where else the stories are told"
    auto: facet
    facet: told
    note: "The same stories sorted by the `told` tag: in the Bible, in other Jewish and Christian writings, or only in the Quran."

  - title: "When they were told"
    auto: period
    note: "Most of the stories come in Meccan surahs, when Muhammad was the one being mocked; the Medinan surahs mention them in passing."

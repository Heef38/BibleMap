# The Last Day in the Quran: death, the end of the world, the resurrection, the judgment, the Garden
# and the Fire, and who goes where. Groups run in the order of what the Quran describes, from the
# grave to the final home. `bible:` points to the Bible where it speaks of the same thing, alike or
# not. Quotations follow Talal Itani's translation.
id: the-last-day
title: "The Last Day, Paradise and Hell"
subtitle: "The end of the world, the resurrection, the scales and the books, the Garden and the Fire, and who is saved"
kind: connections
added: "2026-09-30"
summary: >-
  After God Himself, the Quran's great subject is the Day. The early surahs are full of it: the
  sun rolled up, the mountains like tufted wool, the graves opened, “when the girl, buried alive,
  is asked: for what crime was she killed?” Everyone will be raised, body and bones, and the
  Quran argues for it again and again against those who laughed at the idea: the One who made you
  the first time can make you again, as rain brings the dead earth to life. Each person will be
  judged alone, by their own deeds, weighed on scales, written in a book given into the right hand
  or the left; “no soul bears the burdens of another,” and no ransom is taken. Then the Garden,
  described more fully than in any other scripture, with rivers of water, milk, wine and honey,
  and companions; or the Fire, with boiling water and new skins for the burned. The groups follow
  that order. The last one gathers the verses on who will be saved, some of which Muslims have
  long read in different ways.
tags: [last day, judgment, resurrection, paradise, hell, afterlife, hour]
views:
  - title: "From the grave to the final home"
    note: "What the Quran describes, in the order it happens."
    groups:
      - title: "Death and the barrier"
        note: "The Quran says little about the time between death and the resurrection. Tradition fills it with the questioning in the grave."
        refs:
          - ref: "32:11"
            label: "“The angel of death put in charge of you”"
          - ref: "8:50"
            label: "Angels strike the faces and backs of the unbelievers at death"
            note: "“Taste the agony of the Burning.” Also 47:27."
          - ref: "23:99-100"
            label: "“My Lord, send me back”"
            note: "“By no means! … And behind them is a barrier (barzakh), until the Day they are resurrected.” Jesus tells of a rich man who asks for the same, with “a great chasm” between."
            bible: "Luke 16:19-31"
          - ref: "40:45-46"
            label: "Pharaoh's people exposed to the Fire morning and evening"
            note: "Before the Hour comes. Muslim theologians took this as a sign of punishment in the grave."

      - title: "The Hour comes"
        note: "The early surahs open with the end of the world, often in short oaths. No one but God knows when it will come."
        refs:
          - ref: "81:1-14"
            label: "“When the sun is rolled up”"
            note: "Stars dimmed, mountains moving, oceans aflame, “when the girl, buried alive, is asked: for what crime was she killed?”, and “each soul will know what it has readied.”"
            bible: "Matt 24:29-31"
          - ref: "82:1-5"
            label: "“When the sky breaks apart”"
          - ref: "99"
            label: "The Quake: “Whoever has done an atom's weight of good will see it”"
          - ref: "101:1-5"
            label: "The Shocker: people like scattered moths"
          - ref: "7:187"
            label: "“Knowledge of it rests with my Lord”"
            note: "“It will not come upon you except suddenly.” Jesus: “No one knows about that day or hour.”"
            bible: "Matt 24:36; 1 Thess 5:2"

      - title: "The resurrection"
        note: "The Meccans' main objection was that the dead cannot live again. The Quran answers it more than any other doubt."
        refs:
          - ref: "36:77-83"
            label: "“Who will revive the bones when they have decayed?”"
            note: "“He who initiated them in the first instance will revive them.”"
            bible: "Ezek 37:1-14"
          - ref: "75:3-4"
            label: "“We are Able to reconstruct his fingertips”"
          - ref: "22:5-7"
            label: "From dust to a drop to a clot: “If you are in doubt about the Resurrection”"
            note: "The stages of the child in the womb, and dead earth coming to life with rain, are both given as proof."
          - ref: "50:2-11"
            label: "“Likewise is the resurrection”"
            note: "The sky, the earth, rain on a dead town."
          - ref: "17:49-52"
            label: "“Even if you become rocks or iron”"
          - ref: "36:51-54"
            label: "The Trumpet: “they will rush from the tombs to their Lord”"
            note: "Also 39:68: blown once, and all are stunned; blown again, and they rise."
            bible: "1 Cor 15:51-52; 1 Thess 4:16"

      - title: "The judgment"
        note: "Each person is judged on their own deeds, by scales, by a written record, and by the witness of their own body."
        refs:
          - ref: "39:69-75"
            label: "“The Book will be put in place”"
            note: "Prophets and witnesses brought in; judgment passed “equitably”; the unbelievers driven to Hell in throngs and the God-fearing led to Paradise in throngs."
            bible: "Rev 20:11-15"
          - ref: "21:47"
            label: "The scales of justice"
            note: "“Even if it be the weight of a mustard-seed, We will bring it up.”"
          - ref: "101:6-11"
            label: "Heavy scales and light"
            note: "“As for he whose scales are light, his home is the Abyss.”"
            bible: "Dan 5:27"
          - ref: "17:13-14"
            label: "“Read your book”"
            note: "“For every person We have attached his fate to his neck.”"
          - ref: "69:18-37"
            label: "The book in the right hand, or the left"
            note: "“Here, take my book and read it,” or “I wish I was never given my book.” The one in the left hand “would not believe in God the Great, nor would he advocate the feeding of the destitute.”"
            bible: "Matt 25:31-46"
            links:
              - { to: "84:7-12", topic: "The book given behind the back" }
          - ref: "36:65"
            label: "“Their hands will speak to Us”"
            note: "Mouths sealed, feet testify. In 41:19-23 hearing, sight and skins testify."
          - ref: "6:164"
            label: "“No soul bears the burdens of another”"
            note: "Said five times (also 17:15, 35:18, 39:7, 53:38). Ezekiel says the same of fathers and sons; the New Testament says Christ bore the sins of others, which Muslims hold no one can do."
            bible: "Ezek 18:20; 1 Pet 2:24"
          - ref: "2:48"
            label: "No intercession, no ransom"
            note: "“Beware of a Day when no soul will avail another in the least, nor will any intercession be accepted on its behalf, nor will any ransom be taken from it.” Said to the Children of Israel. Jesus says he came “to give His life as a ransom for many.”"
            bible: "Mark 10:45"
          - ref: "20:108-112"
            label: "Intercession only by His permission"
            note: "Later Muslim belief gives Muhammad the great intercession on that Day; the Quran speaks only of intercession God permits (also 2:255, 53:26)."
          - ref: "19:71-72"
            label: "“There is not one of you but will go down to it”"
            note: "Tradition reads this of a bridge over Hell (the sirat) that all must cross; the Quran does not describe one."
          - ref: "57:12-15"
            label: "“Wait for us; let us absorb some of your light”"
            note: "The hypocrites ask the believers for light, and a wall with a door rises between them. Jesus' parable of the ten virgins has the foolish ask, “Give us some of your oil.”"
            bible: "Matt 25:1-13"

      - title: "Three kinds of people"
        refs:
          - ref: "56:7-14"
            label: "The forerunners, those on the Right, those on the Left"
            note: "“The forerunners, the forerunners. Those are the nearest.” Many of them from the ancients, few from the latecomers."
          - ref: "7:46-49"
            label: "The Elevations"
            note: "Men on the heights between the Garden and the Fire, who have not yet entered but hope to. Surah 7 is named for them."

      - title: "The Garden"
        note: "Gardens with rivers beneath, shade, fruit within reach, couches, silk, cups passed by youths, companions, peace, and God's good pleasure."
        refs:
          - ref: "2:25"
            label: "“Gardens beneath which rivers flow”"
            note: "The phrase comes over thirty times. “Whenever they are provided with fruit therefrom … they will say, ‘This is what we were provided with before.’”"
            bible: "Rev 22:1-2"
          - ref: "47:15"
            label: "Rivers of water, milk, wine and honey"
            note: "Set against “one abiding in the Fire forever, and are given to drink boiling water, that cuts-up their bowels.” Canaan was a land “flowing with milk and honey.” The wine of the Garden causes “neither headache, nor intoxication” (56:19, 37:47)."
            bible: "Exod 3:8; Matt 26:29"
          - ref: "55:46-60"
            label: "Two gardens for whoever feared the standing of his Lord"
            note: "“So which of your Lord's marvels will you deny?” runs through the surah 31 times. “Is the reward of goodness anything but goodness?”"
          - ref: "56:15-40"
            label: "Couches, youths, cups, fruit and meat of birds"
            note: "“Therein they will hear no nonsense, and no accusations. But only the greeting: ‘Peace, peace.’”"
          - ref: "76:12-22"
            label: "Silk, silver and a spring called Salsabeel"
            note: "“Neither sun, nor frost.” “Their Lord will offer them a pure drink.”"
          - ref: "13:23-24"
            label: "With their parents, spouses and children"
            note: "The righteous among their families enter with them (also 52:21), and the angels greet them, “Peace be upon you, because you endured patiently.”"
          - ref: "7:43"
            label: "“We will remove whatever rancor is in their hearts”"
            bible: "Rev 21:3-4"
          - ref: "9:72"
            label: "“But approval from God is even greater”"
            note: "Gardens, fine homes “in the Gardens of Eden,” and God's good pleasure above them all."
          - ref: "10:26"
            label: "“Goodness, and more”"
            note: "Commentators, citing a saying of Muhammad, take “more” to be the sight of God (compare 75:22-23: faces “looking towards their Lord”)."
            bible: "Rev 22:3-5"

      - title: "The companions of the Garden"
        note: "Several passages promise the men of the Garden companions: maidens with lovely eyes (hur), untouched, like pearls. Others speak of “pure spouses” for all believers. The large numbers of wives in some later sayings are not in the Quran. Jesus says that in the resurrection people “will neither marry nor be given in marriage.”"
        refs:
          - ref: "44:51-57"
            label: "“We will wed them to lovely companions”"
            bible: "Matt 22:29-30"
          - ref: "52:20"
            label: "“We will couple them with gorgeous spouses”"
          - ref: "55:56-58"
            label: "“Maidens restraining their glances, untouched before by any man or jinn”"
          - ref: "55:70-74"
            label: "“Companions, secluded in the tents”"
          - ref: "56:22-23"
            label: "“Lovely companions, the likenesses of treasured pearls”"
          - ref: "56:35-38"
            label: "“We have created them of special creation, and made them virgins”"
          - ref: "37:48-49"
            label: "“Bashful women with lovely eyes”"
          - ref: "78:31-36"
            label: "“Splendid spouses, well matched”"
          - ref: "3:15"
            label: "“Purified spouses, and acceptance from God”"
            note: "Said of all the righteous, as in 2:25 and 4:57."

      - title: "The Fire"
        note: "Hell, most often simply “the Fire,” has gates, keepers, and nineteen angels over it; it is fed with people and stones (66:6)."
        refs:
          - ref: "4:56"
            label: "“Every time their skins are cooked, We will replace them”"
          - ref: "14:16-17"
            label: "Putrid water: “Death will come at him from every direction, but he will not die”"
          - ref: "22:19-22"
            label: "Garments of fire and scalding water"
            note: "“Melting their insides and their skins,” and maces of iron."
          - ref: "44:43-50"
            label: "The Tree of Bitterness"
            note: "The zaqqum, “the food of the sinner,” boiling in the belly. Also 37:62-68 and 56:52."
          - ref: "56:41-56"
            label: "Those on the Left"
            note: "Searing wind, boiling water, black smoke, “drinking like thirsty camels drink.”"
          - ref: "67:6-11"
            label: "“Has no warner come to you?”"
            note: "The keepers ask each batch thrown in; they answer, “a warner did come to us, but we disbelieved.”"
          - ref: "74:26-31"
            label: "Saqar, and the nineteen"
          - ref: "78:21-30"
            label: "“Where they will remain for eons”"
          - ref: "104"
            label: "The Crusher, for the backbiter who counts his wealth"
          - ref: "18:29"
            label: "Water like molten brass"
            note: "“Whoever wills—let him believe. And whoever wills—let him disbelieve.” Then the Fire, whose curtains hem them in."
            bible: "Mark 9:43-48; Luke 16:23-24"

      - title: "For how long?"
        note: "Most verses say the people of the Fire remain in it forever. Two add “except as God wills,” and a few Muslim scholars argued from them that the Fire will one day end; most held it eternal for unbelievers. Tradition adds that believers who sinned will be brought out of it."
        refs:
          - ref: "4:168-169"
            label: "“Where they will dwell forever”"
          - ref: "72:23"
            label: "“He who defies God and His Messenger”"
            note: "“… for him is the Fire of Hell, in which they will dwell forever.”"
          - ref: "11:106-108"
            label: "“As long as the heavens and the earth endure, except as your Lord wills”"
            note: "Said of the Fire and of Paradise, which is “a reward without end.”"
          - ref: "6:128"
            label: "“The Fire is your dwelling, wherein you will remain, except as God wills”"
            bible: "Matt 25:46"

      - title: "Who is saved?"
        note: "Faith in God and the Last Day and good deeds, again and again. What that means for Jews and Christians is where these verses have been read differently."
        refs:
          - ref: "2:62"
            label: "“Those who believe, and those who are Jewish, and the Christians, and the Sabeans”"
            note: "“Any who believe in God and the Last Day, and act righteously—will have their reward.” Repeated at 5:69. An early report in al-Tabari's commentary says 3:85 abrogated it; others read it of Jews and Christians before Muhammad, or of those who came to accept him; some modern Muslims read it as it stands."
          - ref: "3:85"
            label: "“Whoever seeks other than Islam as a religion”"
            note: "“… it will not be accepted from him, and in the Hereafter he will be among the losers.”"
            bible: "John 14:6; Acts 4:12"
          - ref: "98:6-8"
            label: "“The worst of creatures,” “the best of creatures”"
            note: "The unbelievers among the People of the Book and the idolaters, forever in the Fire; those who believe and do good, forever in the Gardens."
          - ref: "4:48"
            label: "The one sin not forgiven"
            note: "Associating others with God. 5:72 says the same to those who call the Messiah God: “God has forbidden him Paradise.”"
          - ref: "103"
            label: "Time: “Man is in loss, except those who believe, and do good works”"
            note: "The whole surah, three verses, which a tradition says the Companions recited to one another when they parted."

  - title: "Nöldeke's periods"
    auto: period
    note: "The end of the world fills the earliest surahs; the laws of the Medinan period mention the Day in passing, as the reason to obey them."

  - title: "Mecca and Medina"
    auto: place

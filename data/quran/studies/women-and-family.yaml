# Women, marriage and family in the Quran: creation, reward, marriage, divorce, inheritance,
# testimony, dress, adultery, slave women, children and parents, the Prophet's household, and the
# women of the stories. Each passage is tagged on `how`: whether it treats men and women the same,
# differently, gives women a protection or a right, or sets a limit on them. Where Talal Itani's
# translation softens the Arabic, the notes say so and give Pickthall's. Quotations follow Itani.
id: women-and-family
title: "Women, Marriage and Family"
subtitle: "Men and women created from one soul and rewarded alike; marriage, divorce, inheritance, dress and punishment, where the law treats them differently; and the women of the stories"
kind: connections
chart: patterns
added: "2026-09-30"
summary: >-
  Surah 4 is called “Women,” and much of the Quran's law is family law. Its teaching has two
  sides, and both are plain in the text. Men and women are created “from a single soul,” and
  “whoever works righteousness, whether male or female,” is rewarded alike; one verse (33:35)
  names ten virtues twice over, once for men and once for women. In the Arabia of its day the
  Quran also gave women rights they had not had: it condemns the burying alive of baby girls,
  gives women a share of inheritance and their own dowry, forbids inheriting women like property,
  and punishes those who accuse chaste women without four witnesses. At the same time its law
  treats men and women differently: a man may marry up to four wives and his female slaves are
  lawful to him; a son inherits twice a daughter's share; two women witness in place of one man
  for a debt; “men have a degree over them”; and a husband who fears his wife's disloyalty may
  admonish her, leave her bed, “then strike them” (4:34). The tags sort each passage, so the
  Patterns chart shows how many fall each way. The notes say where the translations differ and
  where later law went further than the Quran, as with stoning, which is not in it.
tags: [women, marriage, divorce, family, inheritance, hijab, polygamy, children, parents]
facetUnit: passages
facets:
  how:
    title: "Men and women"
    note: "A passage can do more than one of these."
    values:
      same: { title: "The same for men and women", note: "Created, addressed, judged or rewarded alike." }
      differs: { title: "Different for men and women", note: "Different rights, shares or duties." }
      protects: { title: "A right or protection for women", note: "Something owed to women, or a harm to them forbidden." }
      limits: { title: "A limit on women", note: "A restriction or punishment for women in particular." }
      story: { title: "A woman in the stories", note: "Women the Quran tells of, good and bad." }
views:
  - title: "What the Quran says"
    groups:
      - title: "Created from one soul, rewarded alike"
        refs:
          - ref: "4:1"
            label: "“Created you from a single soul, and created from it its mate”"
            note: "The Quran does not say the woman was made from a rib, or that she was made after the man for him; the rib is in Genesis. Muslim tradition took it from there."
            bible: "Gen 2:18-24"
            facets: { how: same }
          - ref: "30:21"
            label: "“He planted love and compassion between you”"
            note: "“He created for you mates from among yourselves, so that you may find tranquility in them.”"
            facets: { how: same }
          - ref: "49:13"
            label: "“From a male and a female … The best among you … is the most righteous”"
            bible: "Gal 3:28"
            facets: { how: same }
          - ref: "3:195"
            label: "“I will not waste the work of any worker among you, whether male or female”"
            note: "“You are one of another.”"
            facets: { how: same }
          - ref: "33:35"
            label: "Muslim men and Muslim women, believing men and believing women …"
            note: "Ten virtues, each named for men and for women. Tradition says it came after a wife of the Prophet asked why the Quran spoke only of men."
            facets: { how: same }
          - ref: "9:71"
            label: "“The believing men and believing women are friends of one another”"
            facets: { how: same }
          - ref: "16:97"
            label: "“Whoever works righteousness, whether male or female”"
            note: "Also 4:124."
            facets: { how: same }

      - title: "Marriage"
        refs:
          - ref: "4:3"
            label: "“Two, or three, or four”"
            note: "Said in a passage about orphans: “If you fear you cannot act fairly towards the orphans—then marry the women you like—two, or three, or four. But if you fear you will not be fair, then one, or what you already have.” The last words (Pickthall: “(the captives) that your right hands possess”) mean slave women. Genesis tells of patriarchs with several wives; Jesus goes back to “the two will become one flesh.”"
            bible: "Gen 2:24; Matt 19:4-6"
            facets: { how: differs }
          - ref: "4:129"
            label: "“You will not be able to treat women with equal fairness”"
            note: "“… no matter how much you desire it. But do not be so biased as to leave another suspended.” Some modern Muslims read 4:3 and 4:129 together as discouraging more than one wife."
            facets: { how: [differs, protects] }
          - ref: "4:4"
            label: "“Give women their dowries graciously”"
            note: "The dowry (mahr) is paid by the husband to the wife, and is hers."
            facets: { how: protects }
          - ref: "4:19-21"
            label: "“It is not permitted for you to inherit women against their will”"
            note: "“And live with them in kindness. If you dislike them, it may be that you dislike something in which God has placed much good.” A husband may not take back what he gave."
            facets: { how: protects }
          - ref: "4:22-23"
            label: "Whom a man may not marry"
            note: "Mothers, daughters, sisters, aunts, nieces, foster-mothers and foster-sisters, mothers-in-law, stepdaughters, daughters-in-law, two sisters at once. Leviticus has a similar list."
            bible: "Lev 18:6-18"
            facets: { how: differs }
          - ref: "2:221"
            label: "“Do not marry idolatresses, unless they have believed”"
            note: "The same for men and women. 5:5 allows a man to marry Jewish and Christian women; no verse allows a Muslim woman to marry outside the faith, and the law forbids it (60:10)."
            facets: { how: same }
          - ref: "2:187"
            label: "“They are a garment for you, and you are a garment for them”"
            facets: { how: same }
          - ref: "2:222-223"
            label: "Menstruation, and “your women are cultivation for you”"
            note: "“Keep away from women during menstruation,” as in Leviticus. Then, “approach your cultivation whenever you like” (Pickthall: “a tilth for you”)."
            bible: "Lev 18:19"
            facets: { how: differs }

      - title: "Husband and wife"
        refs:
          - ref: "4:34"
            label: "“Men are the protectors and maintainers of women … then strike them”"
            note: "“… as God has given some of them an advantage over others, and because they spend out of their wealth. The good women are obedient … As for those from whom you fear disloyalty, admonish them, and abandon them in their beds, then strike them.” Pickthall: “Men are in charge of women … and scourge them.” The Arabic verb (daraba) usually means to strike; jurists restricted it (not on the face, not to injure), and some modern translators render it “go away from them.”"
            bible: "Eph 5:25-33; Col 3:19"
            facets: { how: differs }
          - ref: "4:35"
            label: "“An arbiter from his family and an arbiter from her family”"
            facets: { how: same }
          - ref: "2:228"
            label: "“Women have rights similar to their obligations … But men have a degree over them”"
            facets: { how: [differs, protects] }
          - ref: "4:128"
            label: "“If a woman fears maltreatment or desertion from her husband”"
            note: "“There is no fault in them if they reconcile their differences, for reconciliation is best.”"
            facets: { how: protects }
          - ref: "58:1-4"
            label: "“She who argued with you concerning her husband”"
            note: "A woman complains to the Prophet that her husband has put her away by saying “you are to me like my mother's back,” an old Arab form of separation. God answers her: “they are not their mothers,” and the husband must free a slave, fast two months, or feed sixty poor before touching her again. Surah 58 is named for her, “The Woman Who Argued.”"
            facets: { how: [protects, story] }

      - title: "Divorce"
        note: "The husband divorces by declaring it; a wife may buy her release (2:229). The waiting period, the maintenance and the ban on evicting her protect the wife."
        refs:
          - ref: "2:226-232"
            label: "Waiting, taking back, and “setting free kindly”"
            note: "Three periods' wait; “divorce is allowed twice”; after the third, she may return to him only after marrying and being divorced by another man (2:230). “Do not retain them to hurt them.” The Law of Moses forbids a man to take back a wife who has married another; Jesus allows divorce only for sexual immorality."
            bible: "Deut 24:1-4; Matt 19:3-9"
            facets: { how: [differs, protects] }
          - ref: "2:233"
            label: "Nursing for two years, and the father's duty"
            note: "“No mother shall be harmed on account of her child, and no father shall be harmed on account of his child.”"
            facets: { how: protects }
          - ref: "2:234-237"
            label: "Widows, engagements, and the dowry on divorce"
            facets: { how: protects }
          - ref: "2:241"
            label: "“Divorced women shall be provided for, equitably”"
            facets: { how: protects }
          - ref: "65:1-6"
            label: "The surah of Divorce"
            note: "“Do not evict them from their homes.” The waiting period for women past menstruation, “and also for those who have not menstruated,” is three months (65:4). Classical jurists read the last words to include girls married before puberty, and allowed such marriages; many modern Muslims read them of women who do not menstruate for other reasons, and oppose child marriage."
            facets: { how: [protects, differs] }

      - title: "Inheritance and testimony"
        refs:
          - ref: "4:7"
            label: "“Women receive a share of what their parents and relatives leave”"
            note: "Before this, by most accounts, Arab women inherited nothing. In Numbers the daughters of Zelophehad win the right to inherit when there is no son."
            bible: "Num 27:1-11"
            facets: { how: protects }
          - ref: "4:11-12"
            label: "“The male receives the equivalent of the share of two females”"
            note: "Also for brothers and sisters (4:176). Muslim writers explain it by the man's duty to support his family, which the woman's share does not carry."
            facets: { how: differs }
          - ref: "2:282"
            label: "“One man and two women … if one of them fails to remember, the other would remind her”"
            note: "For witnessing a debt. It is the only verse that weighs a woman's testimony against a man's; later law applied it more widely."
            facets: { how: differs }

      - title: "Dress and modesty"
        note: "The Quran asks modesty of both, and more of women. It does not use “hijab” for a head covering; the word means a screen (33:53)."
        refs:
          - ref: "24:30-31"
            label: "“Tell the believing men … and tell the believing women”"
            note: "Both are to lower their gaze and guard their chastity; women are also “to draw their coverings over their breasts, and not expose their beauty” except to husbands, close family, other women, slaves and children. The coverings (khumur) are head-cloths, which jurists took to include covering the hair."
            bible: "1 Tim 2:9-10"
            facets: { how: [same, limits] }
          - ref: "33:59"
            label: "“Lengthen their garments … so they will be recognized and not harassed”"
            note: "To the Prophet's wives and daughters and the believing women: to draw their outer garments (jalabib) about them."
            facets: { how: [limits, protects] }
          - ref: "24:60"
            label: "Older women may lay aside their outer clothing"
            note: "“But to maintain modesty is better for them.”"
            facets: { how: limits }
          - ref: "33:53"
            label: "“Ask them from behind a screen”"
            note: "Said of the Prophet's wives only, and of guests in his house. The word is hijab."
            facets: { how: limits }

      - title: "Adultery and accusation"
        note: "The Quran's penalty for adultery is a hundred lashes, for either. The stoning of married adulterers in Islamic law comes from sayings of the Prophet and a report that it was once a verse; it is not in the Quran. False accusation is punished too."
        refs:
          - ref: "4:15-16"
            label: "Four witnesses; confinement “until death claims them”"
            note: "The earliest rule, for women, “or God makes a way for them,” which tradition says 24:2 then did."
            facets: { how: limits }
          - ref: "24:2-3"
            label: "“Whip each one of them a hundred lashes”"
            note: "“The adulteress and the adulterer … and let no pity towards them overcome you.” In the Law of Moses both are put to death; in John Jesus sends away a woman caught in adultery."
            bible: "Deut 22:22; John 8:3-11"
            facets: { how: same }
          - ref: "24:4-9"
            label: "Eighty lashes for accusing a chaste woman without four witnesses"
            note: "A husband with no witness swears four times and calls God's curse on himself if he lies; she can clear herself by swearing four times that he lies."
            facets: { how: protects }
          - ref: "24:11-20"
            label: "The slander"
            note: "“Why did they not bring four witnesses to testify to it?” Tradition ties it to an accusation against Aisha, the Prophet's wife."
            facets: { how: [protects, story] }

      - title: "Slave women and captives"
        note: "“What your right hands possess” means slaves. The Quran commends freeing them and did not abolish slavery; classical law allowed a man sexual relations with his female slaves, including women taken in war. Itani sometimes translates the phrase in softer words."
        refs:
          - ref: "4:24"
            label: "“All married women, except those you rightfully possess”"
            note: "Pickthall: “save those (captives) whom your right hands possess.” Jurists read it to allow a captive woman whose husband remained among the enemy. Deuteronomy lets a soldier marry a captive woman after a month."
            bible: "Deut 21:10-14"
            facets: { how: differs }
          - ref: "23:5-7"
            label: "“Except from their spouses, or their dependents”"
            note: "Itani: “their dependents”; Pickthall: “the (slaves) that their right hands possess.” Also 70:29-31."
            facets: { how: differs }
          - ref: "4:25"
            label: "Marrying a believing slave woman"
            note: "“With the permission of their guardians,” and her dowry is hers. If she commits adultery, her punishment is half that of a free woman."
            facets: { how: [differs, protects] }
          - ref: "24:32-33"
            label: "“Do not compel your girls to prostitution”"
            note: "“If they desire to remain chaste.” And free the slaves who ask for it, “if you recognize some good in them,” and help them with money."
            facets: { how: protects }
          - ref: "90:11-16"
            label: "“The ascent … The freeing of a slave”"
            note: "Freeing slaves is also a use of the alms (9:60) and the atonement for several sins (4:92, 5:89, 58:3)."
            facets: { how: same }

      - title: "Children and parents"
        refs:
          - ref: "16:58-59"
            label: "“When one of them is given news of a female infant, his face darkens”"
            note: "“Shall he keep it in humiliation, or bury it in the dust? Evil is the decision they make.”"
            facets: { how: protects }
          - ref: "81:8-9"
            label: "“When the girl, buried alive, is asked: For what crime was she killed?”"
            facets: { how: protects }
          - ref: "17:31"
            label: "“Do not kill your children for fear of poverty”"
            note: "Also 6:151."
            facets: { how: same }
          - ref: "17:23-24"
            label: "“Lower to them the wing of humility”"
            note: "Next to the worship of God comes kindness to parents: “do not say to them a word of disrespect.”"
            bible: "Exod 20:12; Eph 6:1-3"
            facets: { how: same }
          - ref: "31:14-15"
            label: "“His mother carried him through hardship upon hardship”"
            note: "Obey parents in everything but idolatry, “but keep them company in this life, in kindness.” 46:15 says the same."
            facets: { how: same }

      - title: "The Prophet's household"
        note: "The only household the Quran addresses by name, with rules for it alone."
        refs:
          - ref: "33:28-34"
            label: "“O wives of the Prophet! You are not like any other women”"
            note: "Offered the choice of divorce or God and His Messenger; double punishment or double reward; “settle in your homes.” The last words are to the Prophet's wives, though many apply them to all women."
            facets: { how: limits }
          - ref: "33:50-52"
            label: "Wives permitted to the Prophet alone"
            note: "Cousins who emigrated with him, a woman who offers herself, and slave women, “exclusively for you, and not for the believers.” Then no more after that. By tradition he had some eleven or thirteen wives; the Quran names none."
            facets: { how: differs }
          - ref: "66:1-5"
            label: "“If he divorces you, his Lord will give him … wives better than you”"
            note: "A quarrel in the Prophet's household, over a secret one wife told another."
            facets: { how: story }

      - title: "Women in the stories"
        note: "Mary is the only woman named. The others are known by their husbands, sons or lands."
        refs:
          - ref: "66:10-12"
            label: "Two wives who betrayed, and two women who believed"
            note: "The wives of Noah and Lot are examples of unbelief; the wife of Pharaoh (“build for me, with you, a house in Paradise”) and Mary are examples for all believers."
            facets: { how: story }
          - ref: "3:35-37"
            label: "The wife of Imran, who vowed her child to God"
            facets: { how: story }
          - ref: "28:7-13"
            label: "The mother and sister of Moses"
            note: "God inspires his mother to cast him into the river, and brings him back to her to nurse."
            bible: "Exod 2:1-10"
            facets: { how: story }
          - ref: "27:29-44"
            label: "The queen of Sheba"
            note: "A ruler who consults her counselors, tests Solomon with a gift, and submits “with Solomon, to God.”"
            bible: "1 Kgs 10:1-13"
            facets: { how: story }
          - ref: "12:23-32"
            label: "The wife of Joseph's master"
            note: "“I did try to seduce him, but he resisted.”"
            bible: "Gen 39:6-20"
            facets: { how: story }

  - title: "Men and women"
    auto: facet
    facet: how
    note: "The same passages sorted by how they treat men and women."

  - title: "Mecca and Medina"
    auto: place
    note: "Nearly all the law is Medinan. The Meccan surahs speak of creation in pairs, kindness to parents, and the buried girl."

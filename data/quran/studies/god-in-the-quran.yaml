# God in the Quran: what it says God is, and what it says He is not. The groups follow the Quran's
# own emphases: the confession that there is no god but God, His names, His work as Creator, His
# knowledge and nearness, His mercy and His anger, and His will over guidance. `bible:` marks where
# the Bible says something alike (or pointedly different), so the two can be read side by side.
# Quotations follow Talal Itani's translation.
id: god-in-the-quran
title: "God in the Quran"
subtitle: "One God with no partner and no son: His names, His creation, His knowledge and nearness, His mercy, His anger and His will"
added: "2026-09-30"
summary: >-
  Almost every page of the Quran is about God. Its one great claim is the one Muslims still
  confess: “There is no god but God.” He is the Creator of the heavens and the earth, who says
  to a thing “Be,” and it is; He knows every falling leaf and is “nearer to the human being than
  his jugular vein”; nothing is like Him, and no vision can grasp Him. He is merciful above all:
  every surah but one opens “In the name of God, the Gracious, the Merciful.” He is also angry
  with the wrongdoers, “leads astray whom He wills, and guides whom He wills,” and cannot be
  questioned. And He has no partner and no son: the Quran says so against the idols of Mecca, the
  Christians and the Jews alike, and calls the claim that God has a son something at which “the
  heavens almost rupture.” A reader who knows the Bible will find much that is familiar here, and
  some things set squarely against it. The Bible links on each passage show both.
tags: [god, oneness, tawhid, names of god, mercy, creation, shirk]
views:
  - title: "Who God is"
    note: "What the Quran says God is, and what it says He is not."
    groups:
      - title: "There is no god but He"
        note: "The confession at the heart of Islam. The Quran says every messenger brought it, and it is the first half of the Muslim creed."
        refs:
          - ref: "112"
            label: "“He is God, the One”"
            note: "Four verses that tradition calls equal to a third of the Quran: God is One and Absolute, “He begets not, nor was He begotten,” and nothing is comparable to Him."
            bible: "Deut 6:4"
          - ref: "2:163"
            label: "“Your God is one God”"
            note: "“There is no god but He, the Benevolent, the Compassionate.”"
          - ref: "2:255"
            label: "The Throne Verse"
            note: "The best-known verse of the Quran: God the Living, the Everlasting, whom “neither slumber overtakes, nor sleep,” who owns all, knows all, and whose Throne extends over the heavens and the earth."
            bible: "Ps 121:3-4"
          - ref: "3:18"
            label: "God bears witness to it Himself"
            note: "“God bears witness that there is no god but He, as do the angels, and those endowed with knowledge.”"
          - ref: "21:25"
            label: "What every messenger was told"
            note: "“We never sent a messenger before you without inspiring him that: ‘There is no god but I, so worship Me.’”"
            links:
              - { to: "16:36", topic: "“Worship God, and avoid idolatry”" }
          - ref: "16:36"
            label: "“To every community We sent a messenger”"
            note: "“Worship God, and avoid idolatry.” Some were guided, some went astray: “see what the fate of the deniers was.”"
          - ref: "47:19"
            label: "“Know that there is no god but God”"
            note: "Said to Muhammad, with the command to ask forgiveness for his sin and for the believers."
          - ref: "37:35"
            label: "The words the Meccans refused"
            note: "“When it was said to them, ‘There is no god except God,’ they grew arrogant.”"

      - title: "The Most Beautiful Names"
        note: "The Quran calls God by many names, which Muslim tradition gathered into a list of ninety-nine. The list itself is not in the Quran; the names are."
        refs:
          - ref: "7:180"
            label: "“So call Him by them”"
            note: "“To God belong the Most Beautiful Names, so call Him by them, and disregard those who blaspheme His names.”"
          - ref: "17:110"
            label: "God, or the Most Merciful"
            note: "“Call Him God, or call Him the Most Merciful. Whichever name you use, to Him belong the Best Names.”"
          - ref: "20:8"
            label: "“His are the Most Beautiful Names”"
          - ref: "59:22-24"
            label: "Fifteen names in three verses"
            note: "The Knower of secrets and declarations, the Compassionate, the Merciful, the Sovereign, the Holy, the Peace-Giver, the Faith-Giver, the Overseer, the Almighty, the Omnipotent, the Overwhelming, the Creator, the Maker, the Designer, the Wise: the longest run of names in the Quran."
          - ref: "57:3"
            label: "“The First and the Last, the Outer and the Inner”"
            note: "In Isaiah God says, “I am the first and I am the last.” In Revelation the risen Jesus says it of himself."
            bible: "Isa 44:6; Rev 22:13"

      - title: "The Creator"
        note: "Creation is the Quran's first argument: the One who made everything is the only one to be worshiped, and the One who made you once can raise you again."
        refs:
          - ref: "6:1-2"
            label: "Heavens and earth, darkness and light"
            note: "“Praise be to God, Who created the heavens and the earth, and made the darkness and the light,” who created you from clay and set your term. “Yet you doubt.”"
          - ref: "7:54"
            label: "Six days, then the Throne"
            note: "“He who created the heavens and the earth in six days, then established Himself on the Throne.” The six days are the Bible's; the Quran does not name a seventh day of rest, and 50:38 says “no fatigue touched Us.”"
            bible: "Gen 1:1-2:3"
          - ref: "41:9-12"
            label: "The earth in two days, the sky in two"
            note: "The sky “was smoke” when God said to it and to the earth, “Come, willingly or unwillingly.” The days here add to eight (2 + 4 + 2); commentators read the four as including the first two."
          - ref: "2:116-117"
            label: "“Be,” and it becomes"
            note: "“Whenever He decrees a thing, He says to it, ‘Be,’ and it becomes.” The same words come back in 3:47 and 3:59, of Jesus."
            bible: "Ps 33:6-9"
          - ref: "36:82"
            label: "“His command, when He wills a thing”"
            note: "“… is to say to it, ‘Be,’ and it comes to be.”"
          - ref: "32:4-5"
            label: "A Day of a thousand years"
            note: "He regulates all affairs, which ascend to Him “on a Day the length of which is a thousand years by your count.”"
            bible: "Ps 90:4; 2 Pet 3:8"
          - ref: "67:1-2"
            label: "He created death and life, to test you"
            note: "“… as to which of you is better in conduct.”"
          - ref: "64:3"
            label: "“He designed you, and designed you well”"

      - title: "He knows, and He is near"
        note: "God's knowledge reaches every leaf and every whisper; He is with people wherever they are."
        refs:
          - ref: "6:59"
            label: "“Not a leaf falls but He knows it”"
            note: "“With Him are the keys of the unseen; none knows them except He.” Jesus says the same of a sparrow."
            bible: "Matt 10:29-30"
          - ref: "50:16"
            label: "“Nearer to him than his jugular vein”"
            note: "“We created the human being, and We know what his soul whispers to him.”"
            bible: "Ps 139:1-12"
          - ref: "2:186"
            label: "“I Am near”"
            note: "“I answer the call of the caller when he calls on Me.” The verse stands in the middle of the rules for the fast."
          - ref: "57:4"
            label: "“He is with you wherever you may be”"
          - ref: "58:7"
            label: "The fourth of three"
            note: "“There is no secret counsel between three, but He is their fourth; nor between five, but He is their sixth.” Jesus: “where two or three gather in My name, there am I with them.”"
            bible: "Matt 18:20"
          - ref: "2:115"
            label: "“Whichever way you turn, there is God's presence”"
          - ref: "64:4"
            label: "He knows what is within the hearts"

      - title: "Nothing is like Him"
        note: "God is beyond comparison and beyond sight. The Quran speaks of His face, His hands and His Throne; how to read them was one of the first great arguments of Muslim theology."
        refs:
          - ref: "42:11"
            label: "“There is nothing like Him”"
            note: "“He is the Hearing, the Seeing.”"
            bible: "Isa 40:18-25"
          - ref: "6:103"
            label: "“No vision can grasp Him”"
            note: "“But His grasp is over all vision.” Contrast 75:22-23, where faces on the Day look to their Lord."
            bible: "John 1:18"
          - ref: "24:35"
            label: "The Light Verse"
            note: "“God is the Light of the heavens and the earth,” like a lamp in a glass “like a brilliant planet,” lit from a blessed olive tree: “Light upon Light.”"
            bible: "1 John 1:5"
          - ref: "55:26-27"
            label: "All perishes but His face"
            note: "“Everyone upon it is perishing. But will remain the Presence of your Lord, Full of Majesty and Splendor.” The Arabic says “face”; Itani writes “Presence.”"
            bible: "Ps 102:25-27"
          - ref: "20:5"
            label: "“On the Throne He settled”"
          - ref: "38:75"
            label: "“What I created with My Own hands”"
            note: "God to Satan, of Adam."

      - title: "He has no partner and no son"
        note: "The other side of the confession. The Quran rejects the gods of Mecca, the belief that angels are God's daughters, and the Christian confession of Jesus as Son of God, in the same breath and with the same arguments."
        refs:
          - ref: "112:3"
            label: "“He begets not, nor was He begotten”"
            bible: "Ps 2:7; John 3:16"
            note: "The Bible calls Jesus God's “one and only Son.” Christian creeds say the Son is “begotten, not made,” eternally and not by a mother; the Quran rejects that God begets at all."
          - ref: "6:101"
            label: "“How can He have a son when He never had a companion?”"
            note: "The argument takes a son to mean offspring of a wife. 72:3 says the same: “He never had a mate, nor a child.”"
          - ref: "19:88-93"
            label: "“Something monstrous”"
            note: "“They say, ‘The Most Merciful has begotten a son.’ You have come up with something monstrous, at which the heavens almost rupture.” All in heaven and earth will come to Him as servants."
          - ref: "9:30-31"
            label: "“The Messiah is the son of God”"
            note: "The Christians' confession, set beside a Jewish one about Ezra that no surviving Jewish writing is known to make; both taken as copying “those who blasphemed before.” They have also taken “their rabbis and their priests as lords.”"
          - ref: "5:72-75"
            label: "“God is the third of three”"
            note: "The Quran rejects “God is the Messiah” and “God is the third of three.” Jesus “was only a messenger … They both used to eat food.” 5:116 suggests the three in view are God, Jesus and Mary, which is not the Christian Trinity (Father, Son and Spirit)."
          - ref: "4:171"
            label: "“Do not say, ‘Three’”"
            note: "Jesus is “the Messenger of God, and His Word that He conveyed to Mary, and a Spirit from Him. … God is only one God. Glory be to Him—that He should have a son.”"
          - ref: "23:91"
            label: "Two gods would fall out"
            note: "“Each god would have taken away what it has created, and some of them would have gained supremacy over others.” 21:22 makes the same argument."
          - ref: "17:111"
            label: "No son, no partner, no ally out of weakness"
          - ref: "37:149-159"
            label: "Daughters for God, sons for you?"
            note: "Against the Meccan belief that the angels are God's daughters, and that He is related to the jinn."
          - ref: "53:19-23"
            label: "Al-Lat, al-Uzza and Manat"
            note: "The three goddesses of Mecca. The only other false gods the Quran names are Baal (37:125) and the five idols of Noah's people (71:23): “These are nothing but names, which you have devised.”"
          - ref: "4:48"
            label: "The sin God does not forgive"
            note: "“God does not forgive association with Him, but He forgives anything less than that to whomever He wills.”"
          - ref: "22:73"
            label: "They could not create a fly"
            note: "“And if the fly steals anything from them, they cannot recover it from it. Weak are the pursuer and the pursued.”"
            bible: "Isa 44:9-20"
          - ref: "29:41"
            label: "The spider's house"
            note: "Those who take protectors other than God are like the spider: “the most fragile of houses is the spider's house.”"

      - title: "The Merciful"
        note: "Mercy is the attribute the Quran names first and most. The two names in the opening line of every surah, the Gracious and the Merciful, come from the same Arabic root, which also means a womb."
        refs:
          - ref: "1:1-3"
            label: "“In the name of God, the Gracious, the Merciful”"
            note: "The words that open every surah but the ninth, and open the prayer."
          - ref: "6:12"
            label: "“He has inscribed for Himself mercy”"
          - ref: "6:54"
            label: "“Your Lord has prescribed mercy for Himself”"
            note: "“Whoever among you does wrong out of ignorance, and then repents afterwards and reforms—He is Forgiving and Merciful.”"
          - ref: "7:156"
            label: "“My mercy encompasses all things”"
            note: "Said to Moses. The next words specify it “for those who act righteously and practice regular charity, and those who believe in Our signs.”"
          - ref: "39:53"
            label: "“Do not despair of God's mercy”"
            note: "“O My servants who have transgressed against themselves … God forgives all sins.”"
            bible: "Isa 55:7"
          - ref: "40:7"
            label: "“You have encompassed everything in mercy and knowledge”"
            note: "The prayer of the angels who carry the Throne, for those who repent."

      - title: "Whom God loves"
        note: "The Quran speaks of God's love mostly as His love for those who do certain things, and His not loving those who do others. It calls Him “the Loving” twice. It does not say “God is love,” as 1 John does, and it never calls Him Father."
        refs:
          - ref: "3:31"
            label: "“If you love God, then follow me”"
            note: "“… and God will love you, and will forgive you your sins.”"
          - ref: "5:54"
            label: "“A people whom He loves and who love Him”"
          - ref: "2:195"
            label: "“God loves the charitable”"
          - ref: "2:222"
            label: "“God loves the repentant”"
            note: "“… and He loves those who keep clean.”"
          - ref: "3:57"
            label: "“God does not love the unjust”"
          - ref: "85:14"
            label: "“The Forgiving, the Loving”"
            bible: "1 John 4:8-10"
          - ref: "5:18"
            label: "“We are the children of God, and His beloved”"
            note: "The claim of Jews and Christians, answered: “Why then does He punish you for your sins? In fact, you are humans from among those He created.”"
            bible: "Rom 8:15-16"

      - title: "His justice and His anger"
        note: "God wrongs no one, and is angry with those who do wrong."
        refs:
          - ref: "4:40"
            label: "Not an atom's weight of injustice"
            note: "“And if there is a good deed, He doubles it.”"
          - ref: "1:7"
            label: "“Those against whom there is anger”"
            note: "The last line of the opening prayer, said many times a day. Muslim commentators have commonly taken the two groups to be the Jews and the Christians; the verse names no one."
          - ref: "48:6"
            label: "God is angry with them, and has cursed them"
            note: "The hypocrites and the idolaters, men and women, “those who harbor evil thoughts about God.”"
          - ref: "21:23"
            label: "“He will not be questioned about what He does”"
            note: "“… but they will be questioned.”"
          - ref: "5:64"
            label: "“God's hand is tied”"
            note: "A saying the Quran puts in the mouth of the Jews, answered: “His hands are outstretched; He gives as He wills.”"

      - title: "His will: He guides and leads astray"
        note: "The Quran says both that God guides and leads astray whom He wills, and that each person chooses and will answer for it. Muslim theologians argued over how the two fit for centuries."
        refs:
          - ref: "14:4"
            label: "“God leads astray whom He wills, and guides whom He wills”"
            note: "Said of every messenger, sent “in the language of his people.”"
          - ref: "16:93"
            label: "“Had God willed, He would have made you one congregation”"
            note: "“… And you will surely be questioned about what you used to do.”"
          - ref: "74:31"
            label: "The nineteen wardens of the Fire"
            note: "Their number is a stumbling block for some and a strengthening for others: “Thus God leads astray whom He wills, and guides whom He wills.”"
          - ref: "76:29-31"
            label: "“You cannot will, unless God wills”"
            note: "“Whoever wills, let him take a path to his Lord. Yet you cannot will, unless God wills.” 81:28-29 says the same."
          - ref: "18:29"
            label: "“Whoever wills—let him believe”"
            note: "“And whoever wills—let him disbelieve.” The next words describe the Fire."
          - ref: "13:11"
            label: "“God does not change the condition of a people until they change what is within themselves”"
          - ref: "3:26-27"
            label: "“You grant sovereignty to whom You will”"
            note: "“You honor whom you will, and You humiliate whom you will.” Hannah's song says the same."
            bible: "1 Sam 2:6-8"

      - title: "He answers in kind"
        note: "The Quran often uses the same verb of God's response as of what people do: they plot, and He plots; they forget Him, and He forgets them; they mock, and He mocks them."
        refs:
          - ref: "3:54"
            label: "“God is the Best of planners”"
            note: "Of those who plotted against Jesus. 8:30 says the same of those who plotted to kill or expel Muhammad. The Arabic word is often translated “schemers” or “plotters.”"
          - ref: "8:30"
            label: "“They planned, and God planned”"
          - ref: "4:142"
            label: "“The hypocrites try to deceive God, but He is deceiving them”"
          - ref: "9:67"
            label: "“They forgot God, so He forgot them”"
          - ref: "2:15"
            label: "“It is God who ridicules them”"

      - title: "Everything glorifies Him"
        note: "The whole creation praises God, whether people see it or not."
        refs:
          - ref: "17:44"
            label: "“There is not a thing that does not glorify Him”"
            note: "“… but you do not understand their praises.”"
            bible: "Ps 148"
          - ref: "57:1-2"
            label: "“Glorifying God is everything in the heavens and the earth”"
          - ref: "64:1"
            label: "“To Him belongs the Kingdom, and to Him all praise is due”"

  - title: "Mecca and Medina"
    auto: place
    note: "The same passages, by where the traditional classification places their surahs."

  - title: "Nöldeke's periods"
    auto: period
    note: "The same passages in the four periods of the nineteenth-century scholar Theodor Nöldeke, who dated the surahs by their style: short, rhymed, urgent early Meccan surahs, then longer and more narrative ones, then the Medinan."

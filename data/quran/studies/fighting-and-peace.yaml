# Fighting and peace in the Quran: every main passage on war, in the order the events behind them
# took place by the traditional account, from the years of patience at Mecca to the final
# declaration of surah 9. Each passage is tagged with what it does (`stance`) and whom it is about
# (`against`), so the views and the Patterns chart can sort them. Where Talal Itani's translation
# softens or sharpens the Arabic, the notes say so and give another. Quotations follow Itani.
id: fighting-and-peace
title: "Fighting and Peace"
subtitle: "From “repel evil with good” to “kill the polytheists wherever you find them”: what the Quran says about war, in the order it was said, and whom each verse is about"
kind: connections
chart: patterns
added: "2026-09-30"
summary: >-
  No subject in the Quran is quoted more selectively, by its critics and its defenders alike.
  This study gathers the main passages and puts them in order. For twelve years at Mecca the
  Quran tells Muhammad to bear insults, turn away, and “repel evil with good”; it commands no
  fighting. After the move to Medina in 622, “permission is given to those who are fought
  against” (22:39), and the believers are told to “fight in the cause of God those who fight you,
  but do not commit aggression” (2:190). The battles of Badr and Uhud follow, and whole surahs
  are given to them. The last word, by the traditional order, is surah 9 (631): a four-month
  notice to the idolaters of Arabia, then “kill the polytheists wherever you find them … but if
  they repent, and perform the prayers, and pay the alms, then let them go their way,” and the
  command to fight those of the People of the Book who do not believe “until they pay the due
  tax.” Beside these stand limits the Quran never withdraws in so many words: accept peace when
  it is offered, keep treaties, protect whoever asks, “there shall be no compulsion in religion.”
  How the later verses bear on the earlier ones is the real question. Classical jurists mostly
  read surah 9 as the final rule, and some said it cancelled over a hundred earlier verses of
  patience; many modern Muslims read every command to fight as bound to its occasion, a war
  already under way. The tags let you see how many passages fall each way.
tags: [fighting, war, jihad, peace, treaties, badr, uhud, surah 9, sword verse, jizya]
facetUnit: passages
facets:
  stance:
    title: "What the passage does"
    values:
      forbear: { title: "Bear it, forgive, turn away", note: "Patience with enemies, and no fighting." }
      defend: { title: "Fight those who fight you", note: "Fighting permitted or commanded against attackers, within limits." }
      command: { title: "Fight them until …", note: "A command to fight with an aim beyond self-defense: until religion is God's, until they pay the tax, until they repent." }
      limit: { title: "Limits, treaties and peace", note: "Restraints on fighting: no aggression, keep treaties, accept peace, protect whoever asks, no compulsion." }
      reward: { title: "The reward of those who fight", note: "Paradise and God's love for those who fight and die, and blame for those who stay behind." }
      battle: { title: "A battle recalled", note: "Passages about a particular battle or campaign." }
  against:
    title: "Whom it is about"
    values:
      attackers: { title: "Those who fight the believers", note: "Enemies described by what they do, not by their religion." }
      idolaters: { title: "The idolaters of Arabia", note: "Above all the Quraysh of Mecca." }
      book: { title: "Jews and Christians", note: "The People of the Book." }
      hypocrites: { title: "The hypocrites and waverers", note: "Professed believers who would not fight or who changed sides." }
views:
  - title: "In the order of events"
    note: "The groups follow the traditional account of the life of Muhammad. The Quran itself dates almost nothing, and the dating of single verses is the work of later scholars."
    groups:
      - title: "At Mecca: patience (610–622)"
        note: "The believers are a small, mocked minority. The Quran tells them to endure, to argue gently, and to leave judgment to God."
        refs:
          - ref: "15:94-95"
            label: "“Proclaim openly … and turn away from the polytheists”"
            facets: { stance: forbear, against: idolaters }
          - ref: "16:125-128"
            label: "“Debate with them in the most dignified manner”"
            note: "“If you were to retaliate, retaliate to the same degree as the injury done to you. But if you resort to patience—it is better for the patient.”"
            bible: "Matt 5:38-39"
            facets: { stance: forbear, against: idolaters }
          - ref: "41:34-35"
            label: "“Repel evil with good”"
            note: "“… and the person who was your enemy becomes like an intimate friend.” Paul: “Do not be overcome by evil, but overcome evil with good.”"
            bible: "Rom 12:17-21"
            facets: { stance: forbear }
          - ref: "23:96"
            label: "“Repel evil by what is better”"
            facets: { stance: forbear }
          - ref: "73:10"
            label: "“Endure patiently what they say, and withdraw from them politely”"
            facets: { stance: forbear, against: idolaters }
          - ref: "109"
            label: "“You have your way, and I have my way”"
            note: "The whole surah: “I do not worship what you worship. Nor do you worship what I worship.”"
            facets: { stance: forbear, against: idolaters }
          - ref: "43:88-89"
            label: "“Pardon them, and say, ‘Peace’”"
            facets: { stance: forbear, against: idolaters }
          - ref: "45:14"
            label: "“Forgive those who do not hope for the Days of God”"
            facets: { stance: forbear }
          - ref: "6:108"
            label: "“Do not insult those they call upon besides God”"
            note: "“… lest they insult God out of hostility and ignorance.”"
            facets: { stance: forbear, against: idolaters }
          - ref: "10:99"
            label: "“Will you compel people to become believers?”"
            facets: { stance: limit }
          - ref: "88:21-22"
            label: "“You have no control over them”"
            note: "“So remind. You are only a reminder.” Also 50:45: “you are not a dictator over them.”"
            facets: { stance: forbear }

      - title: "At Medina: fighting permitted (622–624)"
        note: "After the emigration the believers have a town of their own and are at war with Mecca. By most accounts these are the first verses to allow fighting."
        refs:
          - ref: "22:38-41"
            label: "“Permission is given to those who are fought against”"
            note: "“Those who were unjustly evicted from their homes, merely for saying, ‘Our Lord is God.’ Were it not that God repels people by means of others: monasteries, churches, synagogues, and mosques … would have been demolished.” Surah 22 is counted Medinan; many scholars take these as the first verses on fighting."
            facets: { stance: defend, against: attackers }
          - ref: "2:190-194"
            label: "“Fight those who fight you, but do not commit aggression”"
            note: "The next verse says “kill them wherever you overtake them, and expel them from where they had expelled you,” and 2:193, “fight them until there is no oppression, and worship becomes devoted to God alone. But if they cease, then let there be no hostility except against the oppressors.” The word Itani renders “oppression” here (fitna) is rendered “persecution” by others."
            facets: { stance: [defend, command, limit], against: [attackers, idolaters] }
          - ref: "2:216-218"
            label: "“Fighting is ordained for you, even though you dislike it”"
            note: "Then the question of fighting in a sacred month, which tradition ties to a raid at Nakhla in 624: “fighting during it is deplorable; but to bar others from God's path … and to expel its people from it, are more deplorable.”"
            facets: { stance: [command, defend], against: idolaters }
          - ref: "2:256"
            label: "“There shall be no compulsion in religion”"
            note: "Some classical scholars held it was cancelled by the later commands of surah 9; others that it always stood, or applied to the People of the Book, who could keep their religion and pay the tax."
            facets: { stance: limit }
          - ref: "2:244"
            label: "“Fight in the cause of God”"
            facets: { stance: command }

      - title: "Badr (624)"
        note: "The first great battle, in which a few hundred believers defeated a larger Meccan force. Surah 8, “The Spoils,” is given to it."
        refs:
          - ref: "8:5-19"
            label: "A thousand angels, and “strike above the necks”"
            note: "Some believers went reluctantly; God promised one of two Meccan groups, a caravan or an army. He sends angels and tells them, “I will cast terror into the hearts of those who disbelieve. So strike above the necks, and strike off every fingertip of theirs.” “It was not you who killed them, but it was God who killed them.”"
            facets: { stance: battle, against: idolaters }
          - ref: "8:38-40"
            label: "“If they desist, their past will be forgiven”"
            note: "“Fight them until there is no more persecution, and religion becomes exclusively for God.”"
            facets: { stance: [command, limit], against: idolaters }
          - ref: "8:41"
            label: "A fifth of the spoils"
            note: "For God and the Messenger, relatives, orphans, the poor and the wayfarer; “the Day of Distinction, the day when the two armies met.”"
            facets: { stance: battle }
          - ref: "8:55-60"
            label: "Treaty-breakers: “make of them a fearsome example”"
            note: "“Prepare against them all the power you can muster … to terrify thereby God's enemies and your enemies.” The verb, to strike fear, is from the root of the modern Arabic word for terrorism."
            facets: { stance: command, against: attackers }
          - ref: "8:61"
            label: "“If they incline towards peace, then incline towards it”"
            note: "Some classical scholars held that surah 9 cancelled this; others that it stands. 47:35 says, “do not waver and call for peace while you have the upper hand.”"
            facets: { stance: limit, against: attackers }
          - ref: "8:65-66"
            label: "Twenty against two hundred, then a hundred against two hundred"
            note: "A command made lighter within two verses, “knowing that there is weakness in you.”"
            facets: { stance: command }
          - ref: "8:67-70"
            label: "Prisoners and ransom"
            note: "“It is not for a prophet to take prisoners before he has subdued the land.” Tradition says Muhammad had taken ransom for the prisoners of Badr and was rebuked; the next verses allow what was taken, and promise the prisoners forgiveness if there is good in their hearts."
            facets: { stance: battle, against: idolaters }
          - ref: "3:123-126"
            label: "“God had given you victory at Badr, when you were weak”"
            facets: { stance: battle }

      - title: "Uhud (625)"
        note: "A year later the Meccans came back and won. Surah 3 explains the defeat as a test."
        refs:
          - ref: "3:121-122"
            label: "“When two groups among you almost faltered”"
            facets: { stance: battle }
          - ref: "3:139-146"
            label: "“Such days We alternate between the people”"
            note: "A wound for them as for you; “that God may know those who believe, and take martyrs from among you.” “Muhammad is no more than a messenger … If he dies or gets killed, will you turn on your heels?”"
            facets: { stance: [battle, reward] }
          - ref: "3:156-158"
            label: "“Had they stayed with us, they would not have died”"
            note: "Said by those who stayed home. “If you are killed in the cause of God, or die—forgiveness and mercy from God are better than what they hoard.”"
            facets: { stance: reward, against: hypocrites }
          - ref: "3:169-171"
            label: "“Do not consider those killed in the cause of God as dead”"
            note: "“In fact, they are alive, at their Lord, well provided for.”"
            facets: { stance: reward }

      - title: "Those who hang back"
        note: "The Medinan surahs return again and again to believers who would not go out to fight, and to the hypocrites."
        refs:
          - ref: "4:74-78"
            label: "“Why would you not fight … and the helpless men, and women, and children”"
            note: "Those who cry to be delivered “from this town whose people are oppressive.” “Wherever you may be, death will catch up with you, even if you were in fortified towers.”"
            facets: { stance: [command, reward], against: attackers }
          - ref: "4:88-91"
            label: "The hypocrites who will not emigrate"
            note: "“If they turn away, seize them and execute them wherever you may find them … Except those who join people with whom you have a treaty, or those who come to you reluctant to fight … If they withdraw from you, and do not fight you, and offer you peace, then God assigns no excuse for you against them.”"
            facets: { stance: [command, limit], against: hypocrites }
          - ref: "4:94"
            label: "“Do not say to him who offers you peace, ‘You are not a believer’”"
            note: "“… aspiring for the goods of this world.”"
            facets: { stance: limit }
          - ref: "4:95-96"
            label: "The strivers above those who sit at home"
            note: "“Except the disabled.” “God has promised goodness to both.”"
            facets: { stance: reward }
          - ref: "9:38-41"
            label: "“Mobilize, light or heavy”"
            note: "“Unless you mobilize, He will punish you most painfully.” By tradition, the call to the campaign of Tabuk (630)."
            facets: { stance: [command, reward], against: hypocrites }
          - ref: "9:73"
            label: "“Strive against the disbelievers and the hypocrites, and be stern with them”"
            facets: { stance: command, against: [idolaters, hypocrites] }

      - title: "The Jewish tribes of Medina (625–627)"
        note: "The Quran does not name the tribes. Tradition identifies these passages with the exile of the Banu Nadir and the end of the Banu Qurayza."
        refs:
          - ref: "59:2-8"
            label: "“He who evicted those who disbelieved among the People of the Book”"
            note: "Their fortresses did not protect them; “whether you cut down a tree, or leave it standing,” it was by God's will. By tradition, the Banu Nadir, exiled in 625. Their goods went to the Messenger for the poor refugees."
            facets: { stance: battle, against: book }
          - ref: "33:25-27"
            label: "“Some of them you killed, and others you took captive”"
            note: "After the siege of Medina in 627 (the Trench), those of the People of the Book who had backed the besiegers. Tradition (Ibn Ishaq) says the men of the Banu Qurayza, several hundred, were executed, and the women and children enslaved."
            facets: { stance: battle, against: book }

      - title: "The truce, and the rules of battle"
        refs:
          - ref: "48:24-26"
            label: "Hands withheld in the valley of Mecca"
            note: "By tradition, the truce of Hudaybiya (628), when the believers were barred from the pilgrimage and made a treaty instead of fighting."
            facets: { stance: limit, against: idolaters }
          - ref: "48:16-17"
            label: "“You will fight them, unless they submit”"
            note: "Said to the desert Arabs who stayed behind, of “a people of great might.” “There is no blame on the blind, nor any blame on the lame, nor any blame on the sick.”"
            facets: { stance: command }
          - ref: "47:4-7"
            label: "“Strike at their necks,” then grace or ransom"
            note: "“When you have routed them, bind them firmly. Then, either release them by grace, or by ransom, until war lays down its burdens.” The Quran names no other fate for captives; later law also allowed their execution or enslavement."
            facets: { stance: [command, limit], against: attackers }
          - ref: "61:4"
            label: "“God loves those who fight in His cause, in ranks”"
            facets: { stance: reward }
          - ref: "4:92-93"
            label: "“Never should a believer kill another believer”"
            note: "Blood money and freeing a slave for killing by error; Hell forever for killing a believer on purpose."
            facets: { stance: limit }
          - ref: "5:32-33"
            label: "“As if he killed the whole of mankind,” and the next verse"
            note: "5:32, often quoted, was “ordained for the Children of Israel,” and excepts killing “for murder or corruption on earth.” 5:33 then gives the penalty for “those who fight God and His Messenger, and strive to spread corruption on earth”: death, crucifixion, cutting off hand and foot on opposite sides, or exile, “except for those who repent before you apprehend them.”"
            facets: { stance: limit, against: attackers }

      - title: "The final declaration: surah 9 (630–631)"
        note: "The only surah without “In the name of God, the Gracious, the Merciful.” By tradition it was proclaimed at the pilgrimage of 631, after the fall of Mecca, and it is among the last surahs revealed."
        refs:
          - ref: "9:1-4"
            label: "“A declaration of immunity … to the polytheists”"
            note: "Treaties with the idolaters end after four months, except with those who kept their terms: “fulfill the treaty with them to the end of its term.”"
            facets: { stance: [command, limit], against: idolaters }
          - ref: "9:5"
            label: "“Kill the polytheists wherever you find them”"
            note: "“When the Sacred Months have passed … capture them, and besiege them, and lie in wait for them at every ambush. But if they repent, and perform the prayers, and pay the alms, then let them go their way.” Classical scholars called it the Verse of the Sword. Khan's translation adds “[who are at war with you]”, which is not in the Arabic; that is how some read it."
            facets: { stance: command, against: idolaters }
          - ref: "9:6"
            label: "“If anyone of the polytheists asks you for protection, give him protection”"
            note: "“… so that he may hear the Word of God; then escort him to his place of safety.”"
            facets: { stance: limit, against: idolaters }
          - ref: "9:7-15"
            label: "“Fight the leaders of disbelief”"
            note: "Those who broke their oaths, “planned to exile the Messenger, and initiated hostilities against you.” “As long as they are upright with you, be upright with them.”"
            facets: { stance: [command, defend, limit], against: idolaters }
          - ref: "9:29"
            label: "“Fight those … from among those who received the Scripture”"
            note: "“… who do not believe in God, nor in the Last Day, nor forbid what God and His Messenger have forbidden, nor abide by the religion of truth … until they pay the due tax (jizya).” The last words (wa hum saghirun) mean “while they are humbled” (Pickthall: “being brought low”); Itani has “willingly or unwillingly.” It is the basis of the later law under which Jews and Christians lived as protected, taxed subjects. Moses' law also has a city that makes peace pay tribute."
            bible: "Deut 20:10-15"
            facets: { stance: command, against: book }
          - ref: "9:36"
            label: "“Fight the polytheists collectively, as they fight you collectively”"
            facets: { stance: [command, defend], against: idolaters }
          - ref: "9:111"
            label: "“God has purchased from the believers their lives”"
            note: "“They fight in God's way, and they kill and get killed. It is a promise binding on Him in the Torah, and the Gospel, and the Quran.” No passage in the Gospels as Christians have them promises Paradise for fighting."
            bible: "Matt 26:52"
            facets: { stance: reward }
          - ref: "9:123"
            label: "“Fight those of the disbelievers who … near you”"
            note: "Itani has “who attack you”; the Arabic (yalunakum) means “who are near you,” as Pickthall and Khan translate it."
            facets: { stance: command }

      - title: "Friends and enemies"
        note: "Whom the believers may take as allies, and whom they may treat kindly."
        refs:
          - ref: "60:8-9"
            label: "“God does not prohibit you from dealing with them kindly and equitably”"
            note: "“As for those who have not fought against you for your religion, nor expelled you from your homes.” Friendship is forbidden only with those who did."
            facets: { stance: limit, against: attackers }
          - ref: "60:7"
            label: "“Perhaps God will plant affection between you and those … you consider enemies”"
            facets: { stance: limit }
          - ref: "3:28"
            label: "“Believers are not to take disbelievers for friends instead of believers”"
            note: "“… unless it is to protect your own selves against them.”"
            facets: { stance: limit }

  - title: "What the verses do"
    auto: facet
    facet: stance
    note: "The same passages sorted by what they do. A passage can do several things at once: 2:190-194 permits, commands and limits in five verses."

  - title: "Whom they are about"
    auto: facet
    facet: against
    note: "Most commands name the enemy by what they did (fought, expelled, broke a treaty) or by who they were (the idolaters, the People of the Book)."

  - title: "Mecca and Medina"
    auto: place
    note: "Every command to fight is in a Medinan surah."

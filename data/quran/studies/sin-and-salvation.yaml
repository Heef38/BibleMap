# Sin, repentance and salvation in the Quran: what it says saves a person on the Day, and what
# does not. Each passage is tagged on `ground`: faith, deeds, repentance, God's mercy and will, or
# what cannot save (ransom, another's burden, deeds done without faith). `bible:` sets the
# passage beside the Bible, most often beside the Christian teaching of grace and atonement, which
# the Quran's teaching differs from at the root. Quotations follow Talal Itani's translation.
id: sin-and-salvation
title: "Sin, Repentance and Salvation"
subtitle: "Faith and good deeds, the scales, repentance and God's mercy; no ransom and no one to carry another's sins; and why a Muslim hopes but does not presume"
chart: patterns
added: "2026-09-30"
summary: >-
  How is a person saved, according to the Quran? Its answer, given again and again in nearly the
  same words, is “those who believe and do good works.” On the Day every deed is weighed: “those
  whose scales are heavy—those are the successful.” Good deeds take away bad ones; God forgives
  whoever turns back to Him, and “forgives all sins” but one, associating others with Him. What
  the Quran rules out matters as much for a reader who knows the Christian gospel: “no soul bears
  the burdens of another,” and on that Day “no ransom will be accepted.” There is no original sin
  to be undone, no sacrifice that atones for others, no savior but God; Adam sinned, repented and
  was forgiven. The Quran also joins God's sovereign will to human choice, and it gives no one a
  certainty of Paradise: even the Prophet says, “I do not know what will be done with me, or with
  you.” Muslims live in hope of God's mercy and fear of His judgment. The Bible links show where
  the Bible says the same, and where the New Testament says the opposite.
tags: [salvation, faith, good deeds, repentance, forgiveness, sin, mercy, atonement, predestination]
facetUnit: passages
facets:
  ground:
    title: "What it rests on"
    note: "What each passage says a person's end depends on."
    values:
      faith: { title: "Faith", note: "Believing in God, His messengers and the Last Day." }
      deeds: { title: "Good deeds", note: "Righteous works, weighed and rewarded." }
      repent: { title: "Repentance", note: "Turning back to God and asking forgiveness." }
      mercy: { title: "God's mercy and will", note: "God forgives, guides or punishes as He wills." }
      nothing: { title: "What cannot save", note: "Ransom, another's help, or deeds done without faith." }
views:
  - title: "What the Quran says"
    groups:
      - title: "Those who believe and do good works"
        note: "The Quran's standing description of the saved: some fifty times in these words, and many more in others. Faith and deeds are nearly always named together."
        refs:
          - ref: "103"
            label: "“The human being is in loss, except those who believe, and do good works”"
            note: "“… and encourage truth, and recommend patience.”"
            bible: "Eph 2:8-10; Jas 2:14-26"
            facets: { ground: [faith, deeds] }
          - ref: "4:124"
            label: "“Whoever works righteousness, whether male or female, and is a believer”"
            facets: { ground: [faith, deeds] }
          - ref: "29:7"
            label: "“We will remit their sins, and We will reward them”"
            facets: { ground: [faith, deeds] }
          - ref: "20:82"
            label: "“Forgiving towards him who repents, believes, acts righteously, and then remains guided”"
            facets: { ground: [repent, faith, deeds] }
          - ref: "64:17"
            label: "“If you lend God a good loan, He will multiply it for you, and will forgive you”"
            bible: "Prov 19:17"
            facets: { ground: deeds }
          - ref: "49:14"
            label: "“Say, ‘We have submitted,’ for faith has not yet entered into your hearts”"
            note: "The desert Arabs had submitted (islam) but did not yet believe (iman): the two are not the same."
            facets: { ground: faith }

      - title: "The scales"
        note: "The Bible too says each will be judged by what they have done. The New Testament adds that no one is justified by works of the law, but by faith in Christ, who is judged in their place; the Quran does not."
        refs:
          - ref: "7:8-9"
            label: "“Those whose weights are heavy—it is they who are the successful”"
            bible: "Rev 20:12-13; Rom 3:20-24"
            facets: { ground: deeds }
          - ref: "23:101-103"
            label: "“Those whose scales are light … in Hell they will dwell forever”"
            note: "“No relations between them will exist on that Day.”"
            facets: { ground: deeds }
          - ref: "4:40"
            label: "“If there is a good deed, He doubles it”"
            note: "The account is weighted toward mercy: a good deed is doubled (tenfold in 6:160), a bad one counted once."
            facets: { ground: [deeds, mercy] }
          - ref: "99:7-8"
            label: "“Whoever has done an atom's weight of good will see it”"
            facets: { ground: deeds }

      - title: "Good deeds wipe out bad"
        refs:
          - ref: "11:114"
            label: "“The good deeds take away the bad deeds”"
            note: "Said of the prayer. Peter: “Love covers over a multitude of sins.”"
            bible: "1 Pet 4:8; Prov 16:6"
            facets: { ground: deeds }
          - ref: "4:31"
            label: "“If you avoid the worst of what you are forbidden, We will remit your sins”"
            note: "The Quran distinguishes great sins from lesser ones; Muslim scholars made lists of the great sins."
            facets: { ground: [deeds, mercy] }
          - ref: "53:32"
            label: "“Except for minor lapses—your Lord is of Vast Forgiveness”"
            note: "“So do not acclaim your own virtue; He is fully aware of the righteous.”"
            facets: { ground: [deeds, mercy] }
          - ref: "25:68-71"
            label: "“God will replace their bad deeds with good deeds”"
            note: "Even idolatry, murder and adultery, for “those who repent, and believe, and do good deeds.”"
            facets: { ground: [repent, faith, deeds] }

      - title: "Repentance"
        note: "To repent is to turn back (tawba), and God “turns” to the one who turns. No priest or sacrifice stands between."
        refs:
          - ref: "39:53-54"
            label: "“Do not despair of God's mercy, for God forgives all sins”"
            note: "“And turn to your Lord, and submit to Him, before the retribution comes upon you.”"
            bible: "Isa 55:6-7; 1 John 1:9"
            facets: { ground: [repent, mercy] }
          - ref: "3:135-136"
            label: "“Who forgives sins except God?”"
            note: "Those who remember God and ask forgiveness, “and they do not persist in their wrongdoing.” In Mark the scribes ask the same question when Jesus forgives a man's sins."
            bible: "Mark 2:5-7"
            facets: { ground: repent }
          - ref: "4:110"
            label: "“Whoever commits evil … then implores God for forgiveness”"
            facets: { ground: repent }
          - ref: "66:8"
            label: "“Repent to God with sincere repentance. Perhaps your Lord will remit your sins”"
            facets: { ground: repent }
          - ref: "7:23"
            label: "Adam and his wife: “Our Lord, we have done wrong to ourselves”"
            note: "God forgave Adam (2:37). The Quran knows no fall that passes to his children, and so no need for a redeemer. Paul: “through one man sin entered the world.”"
            bible: "Rom 5:12-19"
            facets: { ground: [repent, mercy] }
          - ref: "4:17-18"
            label: "Not “when death approaches”"
            note: "“Repentance is not available for those who commit evils, until when death approaches one of them, he says, ‘Now I repent.’” Pharaoh's last-moment faith is refused (10:90-91). In Luke a dying thief is promised Paradise."
            bible: "Luke 23:39-43"
            facets: { ground: [repent, nothing] }

      - title: "No ransom, and no one bears another's burden"
        note: "This is where the Quran and the New Testament part most deeply. The Quran says that no one can carry another's sins, and no price can buy anyone free; the New Testament says Christ “bore our sins in His body on the tree” and gave his life “as a ransom for many.”"
        refs:
          - ref: "53:38-41"
            label: "“That no soul bears the burdens of another soul”"
            note: "“And that the human being attains only what he strives for.” Given in 53:36-37 as what is in “the Scrolls of Moses” and of Abraham. Ezekiel says the same of father and son."
            bible: "Ezek 18:20; 1 Pet 2:24"
            facets: { ground: nothing }
          - ref: "35:18"
            label: "“Even if one weighted down calls for help with its burden”"
            note: "“Nothing can be lifted from it, even if they were related.” Also 6:164, 17:15, 39:7."
            bible: "Isa 53:4-6"
            facets: { ground: nothing }
          - ref: "2:123"
            label: "“No ransom will be accepted from it, and no intercession will benefit it”"
            bible: "Mark 10:45"
            facets: { ground: nothing }
          - ref: "3:91"
            label: "“Even the earth full of gold would not be accepted”"
            note: "For those who die unbelievers. Also 5:36 and 57:15."
            facets: { ground: nothing }
          - ref: "52:21"
            label: "“Every person is hostage to what he has earned”"
            note: "Yet believing children are joined with their believing parents in the Garden."
            facets: { ground: [deeds, mercy] }
          - ref: "17:15"
            label: "“Nor do We ever punish until We have sent a messenger”"
            note: "No one is punished who was never warned. Muslim scholars applied this to people who never heard the message."
            bible: "Rom 2:12-16"
            facets: { ground: mercy }

      - title: "Deeds that count for nothing"
        note: "Good deeds without faith, or undone by unbelief, weigh nothing."
        refs:
          - ref: "24:39"
            label: "“Their works are like a mirage in a desert”"
            note: "Also 14:18: “like ashes, in a fierce wind.”"
            facets: { ground: nothing }
          - ref: "18:105"
            label: "“We will consider them of no weight”"
            facets: { ground: nothing }
          - ref: "2:217"
            label: "“Whoever among you turns back from his religion, and dies a disbeliever”"
            note: "“… those are they whose works will come to nothing, in this life, and in the Hereafter.” The Quran sets no worldly penalty for leaving Islam; the death penalty in Islamic law comes from sayings of the Prophet."
            facets: { ground: nothing }
          - ref: "39:65"
            label: "“If you idolize, your works will be in vain”"
            note: "Said to Muhammad himself, and to the prophets before him."
            facets: { ground: [faith, nothing] }

      - title: "God forgives whom He wills"
        refs:
          - ref: "2:284"
            label: "“He forgives whom He wills, and He punishes whom He wills”"
            note: "“Whether you reveal what is within your selves, or conceal it, God will call you to account for it.”"
            bible: "Rom 9:15-18"
            facets: { ground: mercy }
          - ref: "4:48"
            label: "“He forgives anything less than that to whomever He wills”"
            note: "Everything but associating others with God, if not repented of (25:70)."
            facets: { ground: mercy }
          - ref: "4:147"
            label: "“What would God accomplish by your punishment, if you have given thanks, and have believed?”"
            facets: { ground: [faith, mercy] }
          - ref: "49:17"
            label: "“It is God who has done you a favor by guiding you to the faith”"
            bible: "Eph 2:8"
            facets: { ground: [faith, mercy] }
          - ref: "3:31"
            label: "“Follow me, and God will love you, and will forgive you your sins”"
            facets: { ground: [faith, mercy] }

      - title: "Hope, not certainty"
        note: "The Quran does not tell believers they can know they are saved. A saying of the Prophet adds that no one enters Paradise by their deeds, “not even I, unless God covers me with His mercy”; tradition also says he named ten companions who would enter it. John writes “so that you may know that you have eternal life.”"
        refs:
          - ref: "46:9"
            label: "“I do not know what will be done with me, or with you”"
            bible: "1 John 5:13"
            facets: { ground: mercy }
          - ref: "7:99"
            label: "“None feel safe from God's plan except the losing people”"
            facets: { ground: mercy }
          - ref: "23:57-61"
            label: "“They give what they give, while their hearts quake”"
            note: "The believers “race towards goodness” in awe, knowing they will return to their Lord."
            facets: { ground: [faith, deeds] }
          - ref: "70:27-28"
            label: "“Their Lord's punishment is not to be taken for granted”"
            facets: { ground: nothing }
          - ref: "2:218"
            label: "“Those look forward to God's mercy”"
            note: "The believers, emigrants and fighters hope; the verse promises nothing more."
            bible: "Rom 8:38-39"
            facets: { ground: [faith, deeds, mercy] }

      - title: "Decree and choice"
        note: "God has written every event, and guides and misguides; each person also chooses, and answers for it. The Quran says both without reconciling them."
        refs:
          - ref: "57:22-23"
            label: "“No calamity occurs … but it is in a Book, even before We make it happen”"
            facets: { ground: mercy }
          - ref: "9:51"
            label: "“Nothing will happen to us except what God has ordained for us”"
            facets: { ground: mercy }
          - ref: "6:125"
            label: "“Whomever God desires to guide, He spreads open his heart to Islam”"
            note: "“… and whomever He desires to misguide, He makes his heart narrow.”"
            facets: { ground: mercy }
          - ref: "2:6-7"
            label: "“God has set a seal on their hearts”"
            note: "Of those who disbelieve: “it is the same for them, whether you have warned them, or have not warned them.” Compare God hardening Pharaoh's heart."
            bible: "Exod 9:12; Rom 9:17-18"
            facets: { ground: mercy }
          - ref: "91:7-10"
            label: "“Inspired it with its wickedness and its righteousness”"
            note: "“Successful is he who purifies it. Failing is he who corrupts it.”"
            facets: { ground: deeds }
          - ref: "90:10"
            label: "“We showed him the two ways”"
            note: "Also 76:3: “We guided him to the way, be he appreciative or unappreciative.”"
            bible: "Deut 30:15-20"
            facets: { ground: deeds }
          - ref: "18:29"
            label: "“Whoever wills—let him believe. And whoever wills—let him disbelieve”"
            facets: { ground: faith }

  - title: "What it rests on"
    auto: facet
    facet: ground
    note: "The same passages sorted by what they say a person's end depends on."

  - title: "Mecca and Medina"
    auto: place

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The title, description, share cards and structured data come from src/config/site.ts (siteMeta in vite.config.ts). -->
    <title>Bible-Map</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-light-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-dark-32.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-light-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('biblemap.settings') || '{}');
        var t = s && s.state && s.state.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Bible-Map</h1>
      <p>A free, interactive map of the Bible: search any person, place or theme and see every reference across Scripture, with guided studies, timelines and connection maps. Bible-Map needs JavaScript turned on.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
